  "metodos-hibridos": ["Quando usar uma abordagem híbrida?", "O que é Scrumban?", "O que é o modelo Cynefin?"],
  "ferramentas": ["Qual a diferença entre Trello e Jira?", "Como escolher uma ferramenta de gestão?", "Para que serve o MS Project?"],
  "papeis-scrum": ["O que faz o Product Owner?", "Quais são os eventos do Scrum?", "Quais são os erros comuns no Scrum?"],
  "setores-publico-privado-terceiro": ["Como o setor público contrata projetos de TI?", "Qual a diferença entre os setores público e privado?", "Como funcionam os projetos no terceiro setor?"],
  "indicadores-e-metricas": ["Como calcular SPI?", "O que é CPI?", "Quais são as métricas DORA?"],
  "soft-skills": ["Quais soft skills um líder precisa?", "Como liderar equipes remotas?", "O que é segurança psicológica?"],
  "casos-reais": ["O que aconteceu no caso Knight Capital?", "Quais são os casos de sucesso?", "Que lições os casos reais ensinam?"],
  "tendencias-futuras": ["Como a IA ajuda na gestão de projetos?", "O que é DevSecOps?", "Qual o novo perfil do gestor?"],
};
const STARTERS = ["Scrum x Kanban?", "Como calcular SPI?", "O que é PRINCE2?", "Quais são os eventos do Scrum?", "Como montar uma matriz de riscos?", "Quando usar uma abordagem híbrida?"];

/* Tabela dos tópicos. No celular cada linha vira um bloco (data-label alimenta os rótulos). */
function tableHTML(table, cls) {
  const head = table.headers.map((h) => `<th scope="col" role="columnheader">${esc(h)}</th>`).join("");
  const rows = table.rows.map((r) => `<tr role="row">` + r.map((cell, i) => i === 0
    ? `<th scope="row" role="rowheader" data-label="${esc(table.headers[0])}">${esc(cell)}</th>`
    : `<td role="cell" data-label="${esc(table.headers[i])}">${esc(cell)}</td>`).join("") + "</tr>").join("");
  return `<div class="tablewrap ${cls || ""}"><table role="table"><thead role="rowgroup"><tr role="row">${head}</tr></thead><tbody role="rowgroup">${rows}</tbody></table></div>`;
}

/* ===== engine.js: assistente e busca que funcionam a partir dos textos dos 12 tópicos =====
   Tudo roda no navegador, sem internet. O assistente não inventa conteúdo: ele procura nos
   textos dos tópicos, monta a resposta com os trechos encontrados e indica onde ler mais. */

const STOP = new Set(("a ao aos as o os um uma uns umas de da do das dos em no na nos nas num numa por pelo pela pelos pelas para pra " +
  "com sem sobre entre e ou mas que qual quais quem quando onde como porque pq se ser sao era foi sera esta estao tem ter ha ja nao sim " +
  "mais menos muito muitos muita muitas pouco meu minha seu sua isso isto esse essa este aquele aquela ali la aqui me te lhe fale fala " +
  "diga dizer explique explica explicar pode podem poderia posso quero queria gostaria saber entender preciso ajuda ajudar favor existe " +
  "existem faz fazem fazer usar usa uso utilizar serve servem vale todo toda todos todas tambem so apenas cada outro outra outros outras " +
  "qualquer pois entao alem ate durante apos antes depois desde conforme segundo seja sejam fica ficam vez vezes coisa coisas algo " +
  "funciona funcionam funcionamento diferenca diferencas versus vs").split(" "));

/* Palavras que só dizem o que a pessoa quer (calcular, definir, listar...): não precisam estar no texto do tópico. */
const QSTOP = new Set("calcular calcule calcula calculo formula formulas definicao definir define conceito significa significado exemplo exemplos liste lista listar".split(" "));

const IRREG = { ageis: "agil", agile: "agil", agilidade: "agil" };
/* Palavras que a pessoa pode usar no lugar das que aparecem nos textos (só valem na pergunta). */
const ALIAS = {
  gerente: ["gestor"], gestor: ["gerente"], gerenciar: ["gestao"], gerenciamento: ["gestao"], gerencia: ["gestao"],
  po: ["product", "owner"], sm: ["scrum", "master"], eap: ["estrutura", "analitica"], wbs: ["eap", "estrutura", "analitica"],
  evm: ["valor", "agregado"], kpi: ["indicador"], kpis: ["indicador"], ia: ["inteligencia", "artificial"],
  cascata: ["waterfall"], waterfall: ["cascata"], preditivo: ["tradicional"], preditiva: ["tradicional"],
  metrica: ["indicador"], metricas: ["indicador"], indicador: ["metrica"], indicadores: ["metrica"],
  lider: ["lideranca"], lideranca: ["lider"], time: ["equipe"], gantt: ["cronograma"], remoto: ["remota"],
};

function stem(w) {
  if (IRREG[w]) return IRREG[w];
  if (w.length > 3 && w.endsWith("s")) w = w.slice(0, -1);
  return w.length > 6 ? w.slice(0, 6) : w;
}
const words = (s) => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
const toks = (s) => words(s).filter((w) => w.length > 1 && !STOP.has(w)).map(stem);

/* ---------- Índice: cada trecho dos tópicos vira um "chunk" ---------- */
const CHUNKS = [];
(function build() {
  const add = (c) => { c.id = CHUNKS.length; CHUNKS.push(c); };
  for (const t of TOPICS) {
    const base = { slug: t.slug, num: t.number, ttitle: t.title };
    add({ ...base, kind: "intro", title: t.title, heading: "", section: "", text: t.intro, extra: [t.short] });
    for (const s of t.sections) {
      const keys = Object.keys(s).filter((k) => k !== "heading");
      const sb = { ...base, heading: s.heading, section: sectionId(s.heading) };
      if (s.text || s.bullets) add({ ...sb, kind: s.bullets ? "list" : "text", title: s.heading, text: s.text || "", bullets: s.bullets || [] });
      for (const c of s.cards || []) add({ ...sb, kind: "card", title: c.title, text: c.text });
      if (s.table) {
        // legenda que vem depois da tabela (ex.: VA = Valor Agregado) acompanha as respostas
        const note = s.text && keys.indexOf("text") > keys.indexOf("table") ? s.text : "";
        const hk = norm(s.table.headers.join(" "));
        add({ ...sb, kind: "table", title: s.heading, text: "", table: s.table, note, headerKey: hk, extra: [s.table.headers.join(" "), ...s.table.rows.map((r) => r.join(" "))] });
        for (const r of s.table.rows) add({ ...sb, kind: "row", title: r[0], text: "", row: r, headers: s.table.headers, note, headerKey: hk, extra: [s.table.headers.join(" "), r.slice(1).join(" ")] });
      }
    }
    add({ ...base, kind: "keys", title: "Pontos-chave", heading: "Pontos-chave", section: "pontos-chave", text: "", bullets: t.takeaways, extra: [t.takeaways.join(" ")] });
  }
})();

const DF = new Map();
let TOTAL_LEN = 0;
for (const c of CHUNKS) {
  const tf = new Map();
  const put = (text, w) => { for (const t of toks(text)) tf.set(t, (tf.get(t) || 0) + w); };
  put(c.title, 3);
  if (c.heading && c.heading !== c.title) put(c.heading, 2);
  put(c.ttitle, 0.7);
  put(c.text, 1);
  (c.bullets || []).forEach((b) => put(b, 1));
  (c.extra || []).forEach((e) => put(e, 1));
  c.tf = tf;
  c.titleTerms = new Set(toks(c.title));
  c.len = Array.from(tf.values()).reduce((a, b) => a + b, 0);
  TOTAL_LEN += c.len;
  tf.forEach((_, t) => DF.set(t, (DF.get(t) || 0) + 1));
}
const AVG = TOTAL_LEN / CHUNKS.length;
const IDF = new Map();
DF.forEach((df, t) => IDF.set(t, Math.log(1 + (CHUNKS.length - df + 0.5) / (df + 0.5))));
const MAXIDF = Math.max(...IDF.values());
const VOCAB = Array.from(IDF.keys());

/* ---------- Pontuação ---------- */
const K1 = 1.2, B = 0.6;
const PRIOR = { card: 1.1, row: 1.05, text: 1, list: 1, table: 0.9, intro: 0.8, keys: 0.55 };

/* igual ou com 1 letra de diferença (troca, falta, sobra ou letras invertidas) */
function ed1(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0;
  while (i < la && i < lb && a[i] === b[i]) i++;
  if (la === lb) return a.slice(i + 1) === b.slice(i + 1) || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
  return la > lb ? a.slice(i + 1) === b.slice(i) : a.slice(i) === b.slice(i + 1);
}
function fuzzy(t) {
  if (IDF.has(t) || t.length < 4) return t;
  let best = null;
  for (const v of VOCAB) if (ed1(t, v) && (!best || DF.get(v) > DF.get(best))) best = v;
  return best || t;
}

function queryTerms(q) {
  const req = new Map();
  const opt = new Map();
  for (const w of words(q)) {
    if (w.length < 2 || STOP.has(w) || QSTOP.has(w)) continue;
    req.set(fuzzy(stem(w)), 1);
    for (const a of ALIAS[w] || []) opt.set(stem(a), 0.6);
  }
  opt.forEach((_, t) => { if (req.has(t)) opt.delete(t); });
  return { req: Array.from(req.keys()), terms: [...req.entries(), ...opt.entries()] };
}
function bm25(c, terms) {
  let s = 0;
  for (const [t, w] of terms) {
    const f = c.tf.get(t);
    if (f) s += w * IDF.get(t) * (f * (K1 + 1)) / (f + K1 * (1 - B + B * c.len / AVG));
  }
  return s;
}
function coverage(c, req) {
  let tot = 0, hit = 0;
  for (const t of req) {
    const w = IDF.has(t) ? IDF.get(t) : MAXIDF;
    tot += w;
    if (c.tf.has(t)) hit += w;
  }
  return tot ? hit / tot : 0;
}
function rank(q, intent) {
  const qt = queryTerms(q);
  const list = [];
  if (!qt.req.length) return { qt, list };
  for (const c of CHUNKS) {
    let s = bm25(c, qt.terms);
    if (s <= 0) continue;
    const cov = coverage(c, qt.req);
    s *= PRIOR[c.kind];
    if (qt.req.every((t) => c.titleTerms.has(t))) s *= c.titleTerms.size === qt.req.length ? 2.4 : 1.6;
    if (intent.calc && c.kind === "row" && /formul/.test(c.headerKey)) s *= 2.2;
    if (intent.calc && c.kind === "table") s *= 0.6;
    if (intent.list && (c.kind === "list" || c.kind === "table")) s *= 1.25;
    if (intent.list && c.kind === "table") s *= 1.2;
    if (intent.list && c.kind === "row") s *= 0.8;
    if (intent.cmp && c.kind === "table") s *= 1.8;   // "diferença entre..." pede a tabela comparativa
    if (intent.cmp && c.kind === "intro") s *= 0.5;
    if (c.kind === "table" && qt.req.filter((t) => c.headerKey.includes(t)).length >= 2) s *= 1.6; // pergunta que cita as colunas da tabela
    if (intent.def && (c.kind === "card" || c.kind === "intro" || c.kind === "text")) s *= 1.15;
    s *= 0.6 + 0.4 * cov;
    list.push({ c, s, cov });
  }
  list.sort((a, b) => b.s - a.s);
  return { qt, list };
}

/* ---------- Pedaços de resposta ---------- */
const h4 = (t) => `<h4 class="ans__t">${esc(t)}</h4>`;
const bullets = (arr) => `<ul>${arr.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>`;
const labelOf = (c) => (c.kind === "card" || c.kind === "row") ? c.title : (c.kind === "intro" ? c.ttitle : c.heading);

function renderChunk(c) {
  switch (c.kind) {
    case "card": return `<div class="ans-card">${h4(c.title)}<p>${esc(c.text)}</p></div>`;
    case "intro": return `<div class="ans-card">${h4(c.ttitle)}<p>${esc(c.text)}</p></div>`;
    case "text": return `<div class="ans-card">${h4(c.heading)}<p>${esc(c.text)}</p></div>`;
    case "list": return `<div class="ans-card">${h4(c.heading)}${c.text ? `<p>${esc(c.text)}</p>` : ""}${bullets(c.bullets)}</div>`;
    case "keys": return `<div class="ans-card">${h4("Pontos-chave: " + c.ttitle)}${bullets(c.bullets)}</div>`;
    case "row": {
      const dl = c.headers.slice(1).map((h, i) => `<div><dt>${esc(h)}</dt><dd>${esc(c.row[i + 1])}</dd></div>`).join("");
      return `<div class="ans-card">${h4(c.row[0])}<dl class="ans-dl">${dl}</dl>${c.note ? `<p class="ans-note">${esc(c.note)}</p>` : ""}</div>`;
    }
    case "table": return `<div class="ans-card">${h4(c.heading)}${tableHTML(c.table, "tablewrap--sm")}${c.note ? `<p class="ans-note">${esc(c.note)}</p>` : ""}</div>`;
  }
  return "";
}
const srcLink = (c, label) => `<a class="src" href="${topicHref(c.slug, c.section)}" title="${esc(c.ttitle)}"><span class="src__n">${c.num}</span><span>${esc(label || labelOf(c))}</span></a>`;
const chipAsk = (q) => `<button type="button" class="chip-q" data-ask="${esc(q)}">${esc(q)}</button>`;
const cleanQ = (s) => norm(s).replace(/[?!.,;:]+/g, " ").replace(/\s+/g, " ").trim();
const follow = (slug, nq) => {
  const fq = (QUESTIONS[slug] || []).filter((x) => cleanQ(x) !== nq).slice(0, 2);
  return fq.length ? `<div class="ans-follow"><span>Você também pode perguntar:</span>${fq.map(chipAsk).join("")}</div>` : "";
};
const topicLinks = () => `<div class="ans-srcs">${TOPICS.map((t) => `<a class="src" href="${topicHref(t.slug)}"><span class="src__n">${t.number}</span><span>${esc(t.title)}</span></a>`).join("")}</div>`;

/* ---------- Respostas prontas para conversa curta ---------- */
const hello = () => ({ html: `<p>Olá! Eu respondo a partir dos textos dos 12 tópicos deste guia e mostro onde ler mais. Experimente perguntar:</p><div class="ans-follow">${STARTERS.slice(0, 3).map(chipAsk).join("")}</div>` });
const thanks = () => ({ html: `<p>Por nada! Se quiser, pergunte sobre outro assunto dos tópicos.</p><div class="ans-follow">${STARTERS.slice(3, 6).map(chipAsk).join("")}</div>` });
const menu = () => ({ html: `<p>Eu respondo a partir dos 12 tópicos deste guia. Escolha um assunto para ler ou faça sua pergunta:</p>${topicLinks()}` });
const notFound = () => ({ html: `<p>Não encontrei isso nos 12 tópicos deste guia. Tente outras palavras, como <strong>riscos</strong>, <strong>Scrum</strong> ou <strong>CPI</strong>, ou escolha um assunto:</p>${topicLinks()}<div class="ans-follow"><span>Exemplos:</span>${STARTERS.slice(0, 3).map(chipAsk).join("")}</div>`, miss: true });
const topicCard = (t) => ({ html: `<div class="ans"><div class="ans-card">${h4(t.number + ". " + t.title)}<p>${esc(t.intro)}</p></div></div><div class="ans-src"><span>Ler o tópico:</span><a class="src" href="${topicHref(t.slug)}"><span class="src__n">${t.number}</span><span>${esc(t.title)}</span></a></div>${follow(t.slug, "")}`, slug: t.slug });

/* ---------- Comparações: "Scrum x Kanban", "diferença entre Trello e Jira" ---------- */
function splitCompare(nq) {
  const pats = [
    /diferen\w*\s+(?:entre\s+)?(.+?)\s+(?:e|x|vs|versus|ou)\s+(.+)$/,
    /compar\w*\s+(?:entre\s+)?(.+?)\s+(?:com|e|x|vs|versus|ou)\s+(.+)$/,
    /^(.+?)\s+(?:x|vs|versus)\s+(.+)$/,
    /(?:melhor|prefer\w*|escolher)\s+(.+?)\s+ou\s+(.+)$/,
    /^(.+?)\s+ou\s+(.+)$/,
  ];
  for (const p of pats) { const m = nq.match(p); if (m) return [m[1], m[2]]; }
  return null;
}
function resolveEntity(part) {
  const req = toks(part).map(fuzzy);
  if (!req.length) return null;
  let best = null;
  for (const c of CHUNKS) {
    if (c.kind !== "card" && c.kind !== "row") continue;
    let tot = 0, hit = 0;
    for (const t of req) { const w = IDF.has(t) ? IDF.get(t) : MAXIDF; tot += w; if (c.titleTerms.has(t)) hit += w; }
    const cov = hit / tot;
    if (cov < 0.45) continue;
    if (!best || cov > best.cov + 0.01 || (Math.abs(cov - best.cov) <= 0.01 && c.titleTerms.size < best.c.titleTerms.size)) best = { c, cov };
  }
  return best ? best.c : null;
}
function tryCompare(nq) {
  const parts = splitCompare(nq);
  if (!parts) return null;
  const a = resolveEntity(parts[0]);
  const b = resolveEntity(parts[1]);
  if (!a || !b || a === b) return null;
  const same = a.slug === b.slug && a.section === b.section;
  return {
    html: `<p class="ans__lead">Comparando <strong>${esc(a.title)}</strong> e <strong>${esc(b.title)}</strong>:</p><div class="cmp">${renderChunk(a)}${renderChunk(b)}</div>` +
      `<div class="ans-src"><span>Onde ler:</span>${srcLink(a)}${same ? "" : srcLink(b)}</div>${follow(a.slug, nq)}`,
    slug: a.slug,
  };
}

/* ---------- Resposta principal ---------- */
function answer(q) {
  const nq = cleanQ(q);
  if (!nq) return null;
  if (/^(oi|ola|opa|bom dia|boa tarde|boa noite|e ai)\b/.test(nq) && nq.split(" ").length <= 4) return hello();
  if (/\b(obrigad[oa]|valeu|agradeco)\b/.test(nq)) return thanks();
  if (/^(ajuda|help|menu|topicos|assuntos|temas)$/.test(nq) || /^(o que (voce|vc) (faz|sabe|responde)|quais (sao )?(os )?(topicos|assuntos|temas)|sobre o que (voce|vc))/.test(nq)) return menu();
  const mt = nq.match(/\btopico\s*(\d{1,2})\b/);
  if (mt && TOPICS[Number(mt[1]) - 1]) return topicCard(TOPICS[Number(mt[1]) - 1]);

  const cmp = tryCompare(nq);
  if (cmp) return cmp;

  const intent = {
    calc: /\b(calcul\w*|formula\w*)\b/.test(nq),
    def: /\b(o que (e|sao|significa|quer dizer)|defin\w*|conceito|significado|quem e)\b/.test(nq),
    list: /\b(quais|liste|lista|tipos|etapas|fases|passos|eventos|papeis|principais|exemplos)\b/.test(nq),
    cmp: /\b(diferenc\w*|compar\w*|versus|vs|x)\b/.test(nq),
  };
  const { qt, list } = rank(q, intent);
  const unknown = qt.req.filter((t) => !IDF.has(t)).length;
  if (!list.length || list[0].cov < 0.25 || (unknown && qt.req.length - unknown <= 1)) return notFound();

  const top = list[0];
  const seen = new Set([top.c.slug + "|" + top.c.section + "|" + top.c.title]);
  const tableBlock = top.c.kind === "row" || top.c.kind === "table";
  const also = [];
  for (const x of list.slice(1)) {
    if (x.s < top.s * 0.5 || x.cov < 0.5) continue;
    if (tableBlock && x.c.slug === top.c.slug && x.c.section === top.c.section) continue;
    const key = x.c.slug + "|" + x.c.section + "|" + x.c.title;
    if (seen.has(key)) continue;
    seen.add(key);
    also.push(x.c);
    if (also.length === 3) break;
  }
  const lead = top.cov >= 0.5 ? "" : `<p class="ans__lead">Não encontrei exatamente isso, mas este trecho pode ajudar:</p>`;
  return {
    html: lead + `<div class="ans">${renderChunk(top.c)}</div><div class="ans-src"><span>Onde ler:</span>${srcLink(top.c)}</div>` +
      (also.length ? `<div class="ans-src"><span>Veja também:</span>${also.map((c) => srcLink(c)).join("")}</div>` : "") + follow(top.c.slug, nq),
    slug: top.c.slug,
  };
}

/* ---------- Busca (Ctrl K): trechos dos tópicos, com link para a seção ---------- */
function searchContent(q, limit = 8) {
  const ws = words(q);
  if (!ws.length) return TOPICS.map((t) => ({ href: topicHref(t.slug), title: t.title, sub: t.short, num: t.number }));
  const live = !/\s$/.test(q);
  const terms = new Map();
  ws.forEach((w, i) => {
    if (STOP.has(w) || w.length < 2) return;
    terms.set(stem(w), 1);
    for (const a of ALIAS[w] || []) if (!terms.has(stem(a))) terms.set(stem(a), 0.6);
    if (live && i === ws.length - 1) for (const v of VOCAB) if (v.startsWith(w) && !terms.has(v)) terms.set(v, 0.7);
  });
  const scored = [];
  for (const c of CHUNKS) {
    const s = bm25(c, Array.from(terms.entries())) * PRIOR[c.kind];
    if (s > 0) scored.push({ c, s });
  }
  scored.sort((a, b) => b.s - a.s);
  const out = [];
  const seen = new Set();
  for (const { c } of scored) {
    const key = c.slug + "#" + c.section;
    if (seen.has(key)) continue;
    seen.add(key);
    const isEntity = c.kind === "card" || c.kind === "row";
    out.push({
      href: topicHref(c.slug, c.section),
      title: isEntity ? c.title : (c.kind === "intro" ? c.ttitle : c.heading),
      sub: isEntity || c.kind === "keys" ? c.ttitle + (c.heading && c.kind !== "keys" ? " — " + c.heading : "") : (c.kind === "intro" ? "Introdução do tópico" : c.ttitle),
      num: c.num,
    });
    if (out.length >= limit) break;
  }
  return out;
}

const CHAT_KEY = "gpti-chat-v1";
let chatHistory = [];
let chatEls = null;

function pushMsg(els, html) {
  els.msgs.insertAdjacentHTML("beforeend", html);
  return els.msgs.lastElementChild;
}
const addUser = (els, q) => pushMsg(els, `<li class="msg msg--user"><div class="bub">${esc(q)}</div></li>`);
const addBot = (els, html) => pushMsg(els, `<li class="msg msg--bot">${botAvatar()}<div class="bub">${html}</div></li>`);
const addTyping = (els) => pushMsg(els, `<li class="msg msg--bot">${botAvatar()}<div class="typing" aria-label="Escrevendo a resposta"><i></i><i></i><i></i></div></li>`);

async function chatAsk(raw) {
  const els = chatEls;
  if (!els) return;
  const q = String(raw || "").replace(/\s+/g, " ").trim().slice(0, 240);
  if (!q) return;
  chatHistory = [...chatHistory, q].slice(-30);
  store.set(CHAT_KEY, chatHistory);
  els.clear.hidden = false;
  const u = addUser(els, q);
  const typing = addTyping(els);
  if (!reduceMotion) await sleep(380);
  typing.remove();
  const res = answer(q);
  addBot(els, res ? res.html : "");
  u.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
}

function mountAssistant() {
  chatHistory = (store.get(CHAT_KEY) || []).filter((x) => typeof x === "string").slice(-30);
  const els = chatEls = { msgs: $("#msgs"), input: $("#ask"), clear: $("#as-clear") };
  els.msgs.innerHTML = welcomeHTML();
  for (const q of chatHistory) {
    addUser(els, q);
    const res = answer(q);
    if (res) addBot(els, res.html);
  }
  els.clear.hidden = !chatHistory.length;
  $("#composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = els.input.value;
    els.input.value = "";
    chatAsk(q);
  });
  els.clear.addEventListener("click", () => {
    chatHistory = [];
    store.set(CHAT_KEY, []);
    els.msgs.innerHTML = welcomeHTML();
    els.clear.hidden = true;
    els.input.focus();
  });
  return () => { if (chatEls === els) chatEls = null; };
}

/* chamada sempre que a tela do assistente é aberta: responde à pergunta que veio de um link */
function chatArrive() {
  if (!chatEls || !pendingAsk) return;
  const q = pendingAsk;
  pendingAsk = null;
  chatAsk(q);
}

/* ===== app.js: troca de páginas pelo endereço (#...), menu e busca (Ctrl K) =====
   Endereços: #inicio  #topicos  #sobre  #assistente  #t-<tópico>  #t-<tópico>--<seção> */
document.documentElement.lang = "pt-BR";
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) { /* segue com o padrão */ }

const main = $("#conteudo");
const announcer = $("#announcer");
const HOME_TITLE = "GP·TI — Guia completo de Gestão de Projetos de TI";
const smooth = reduceMotion ? "auto" : "smooth";
const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent || "");

let current = null;          // página que está na tela
let cleanup = () => {};      // desfaz o que a página atual montou
let lastY = 0;               // última posição de rolagem (para o botão voltar)
let switching = false;       // true enquanto a página troca (ignora a rolagem desse momento)
let navigating = false;      // true quando a mudança de endereço partiu de um clique no site
const scrollMemory = new Map();

/* ---------- Endereço → página ---------- */
function parse(hash) {
  let h = String(hash || "").replace(/^#/, "");
  try { h = decodeURIComponent(h); } catch (e) { /* mantém como veio */ }
  if (!h || h === "inicio") return { kind: "home", key: "inicio", title: HOME_TITLE };
  if (h === "topicos" || h === "sobre") return { kind: "home", key: h, section: h, title: HOME_TITLE };
  if (h === "assistente") return { kind: "assistant", key: h, title: "Assistente — GP·TI" };
  if (h.startsWith("t-")) {
    const i = h.indexOf("--");
    const t = BY_SLUG.get(i < 0 ? h.slice(2) : h.slice(2, i));
    if (t) return { kind: "topic", key: h, t, section: i < 0 ? "" : h.slice(i + 2), title: `${t.number}. ${t.title} — GP·TI` };
  }
  return { kind: "404", key: h, title: "Página não encontrada — GP·TI" };
}
const sameView = (a, b) => !!a && a.kind === b.kind && a.kind !== "404" && (a.kind !== "topic" || a.t === b.t);

/* ---------- Atalho de teclado mostrado nos botões ---------- */
const applyKbd = (root) => $$("[data-kbd]", root).forEach((k) => { k.textContent = isMac ? "⌘ K" : "Ctrl K"; });
applyKbd(document);

/* ---------- Sumário do tópico: destaca a seção que está na tela ---------- */
function watchToc() {
  const links = $$(".toc a");
  const secs = links.map((a) => document.getElementById(a.dataset.sec));
  let raf = 0;
  let active = -1;
  const update = () => {
    raf = 0;
    let idx = 0;
    secs.forEach((el, i) => { if (el && el.getBoundingClientRect().top <= 150) idx = i; });
    if (idx === active) return;
    active = idx;
    links.forEach((a, i) => (i === idx ? a.setAttribute("aria-current", "location") : a.removeAttribute("aria-current")));
  };
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();
  return () => {
    window.removeEventListener("scroll", onScroll);
    window.removeEventListener("resize", onScroll);
    if (raf) cancelAnimationFrame(raf);
  };
}

/* ---------- Monta a página ---------- */
function mount(route) {
  cleanup();
  cleanup = () => {};
  if (route.kind === "home") {
    main.replaceChildren(homeView());
    applyKbd(main);
  } else if (route.kind === "topic") {
    main.innerHTML = topicHTML(route.t);
    cleanup = watchToc();
  } else if (route.kind === "assistant") {
    main.innerHTML = assistantHTML();
    cleanup = mountAssistant();
  } else {
    main.innerHTML = notFoundHTML();
  }
  main.dataset.view = route.kind;
}

function sectionEl(route) {
  if (route.kind === "home" && route.section) return document.getElementById(route.section);
  if (route.kind === "topic" && route.section) return document.getElementById("s-" + route.section);
  return null;
}

function setNav(route) {
  const target = route.kind === "topic" ? "#topicos" : route.kind === "assistant" ? "#assistente" : (route.kind === "home" && route.section ? "#" + route.section : null);
  $$(".nav a, .footer__links a").forEach((a) => {
    if (target && a.getAttribute("href") === target) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}

function moveFocus(route, el) {
  let f = null;
  if (route.kind === "assistant" && chatEls && window.matchMedia("(pointer: fine)").matches) f = chatEls.input;
  if (!f && el) f = el.matches("h2") ? el : $("h2", el);
  if (!f) f = $("#page-h1");
  if (!f) f = main;
  if (!f.hasAttribute("tabindex") && f !== chatEls?.input) f.tabIndex = -1;
  try { f.focus({ preventScroll: true }); } catch (e) { /* sem foco */ }
}

function show(route, { push = false, initial = false } = {}) {
  const prev = current;
  if (prev && !initial) scrollMemory.set(prev.key, lastY);
  switching = true;
  const same = sameView(prev, route);
  if (!same) mount(route);
  current = route;
  document.title = route.title;
  setNav(route);
  closeMenu();

  const el = sectionEl(route);
  const mem = (!push && !initial) ? scrollMemory.get(route.key) : undefined;
  const how = same && push ? smooth : "instant";
  if (mem !== undefined) window.scrollTo({ top: mem, behavior: "instant" });
  else if (el) el.scrollIntoView({ block: "start", behavior: how });
  else window.scrollTo({ top: 0, behavior: how });

  if (route.kind === "assistant") chatArrive();
  if (push && !initial) {
    moveFocus(route, el);
    announcer.textContent = "";
    setTimeout(() => { announcer.textContent = route.title; }, 60);
  }
  requestAnimationFrame(() => requestAnimationFrame(() => { switching = false; lastY = window.scrollY; }));
}

function navigate(hash) {
  const cur = location.hash;
  if (hash === cur || (hash === "#inicio" && (cur === "" || cur === "#"))) {
    show(parse(hash), { push: true });   // mesmo endereço: o navegador não avisa, então trocamos aqui
    return;
  }
  navigating = true;
  location.hash = hash;
}

window.addEventListener("scroll", () => { if (!switching) lastY = window.scrollY; }, { passive: true });
window.addEventListener("hashchange", () => {
  const push = navigating;
  navigating = false;
  show(parse(location.hash), { push });
});

/* ---------- Cliques: links internos, perguntas ao assistente, busca ---------- */
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-ask]");
  if (btn) { e.preventDefault(); chatAsk(btn.dataset.ask); return; }

  if (e.target.closest("[data-open-search]")) { openSearch(); return; }

  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest("a[href^='#']");
  if (!a || a.target === "_blank") return;
  const href = a.getAttribute("href");
  if (href === "#") return;
  e.preventDefault();
  if (href === "#conteudo") { main.focus(); return; }           // "Ir para o conteúdo"
  if (a.hasAttribute("data-ask")) pendingAsk = a.dataset.ask;     // pergunta vinda de um link
  navigate(href);
});

/* ---------- Menu no celular ---------- */
const burger = $("#burger");
const navMenu = $("#menu");
function closeMenu() {
  navMenu.classList.remove("is-open");
  burger.setAttribute("aria-expanded", "false");
  burger.setAttribute("aria-label", "Abrir menu");
}
burger.addEventListener("click", () => {
  const open = navMenu.classList.toggle("is-open");
  burger.setAttribute("aria-expanded", String(open));
  burger.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu");

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && navMenu.classList.contains("is-open")) { closeMenu(); burger.focus(); } });

/* ---------- Busca (Ctrl K ou ⌘ K) ---------- */
const dlg = $("#search");
const qIn = $("#q");
const resultsEl = $("#results");
const emptyEl = $("#empty");
let items = [];
let sel = 0;

function renderResults() {
  const raw = qIn.value;
  const q = raw.trim();
  items = searchContent(raw, 8);
  if (q) items.push({ ask: q, title: `Perguntar ao assistente: «${q}»`, sub: "Monta a resposta com os textos dos tópicos", num: "?" });
  sel = 0;
  const onlyAsk = !!q && items.length === 1;
  emptyEl.hidden = !onlyAsk;
  if (onlyAsk) emptyEl.textContent = `Nenhum trecho dos tópicos tem «${q}». Tente outra palavra ou pergunte ao assistente.`;
  resultsEl.innerHTML = items.map((it, i) => `<li class="sd__item" role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === 0}"><span class="sd__n" aria-hidden="true">${esc(it.num)}</span><span><span class="sd__t">${esc(it.title)}</span><span class="sd__d">${esc(it.sub)}</span></span></li>`).join("");
  if (items.length) qIn.setAttribute("aria-activedescendant", "opt-0"); else qIn.removeAttribute("aria-activedescendant");
}
function select(i, scroll = true) {
  if (!items.length) return;
  sel = (i + items.length) % items.length;
  $$(".sd__item", resultsEl).forEach((li, k) => li.setAttribute("aria-selected", String(k === sel)));
  qIn.setAttribute("aria-activedescendant", "opt-" + sel);
  if (scroll) $("#opt-" + sel).scrollIntoView({ block: "nearest" });
}
function choose(i) {
  const it = items[i];
  if (!it) return;
  dlg.close();
  if (it.ask) { pendingAsk = it.ask; navigate("#assistente"); } else navigate(it.href);
}
function openSearch() {
  if (dlg.open) return;
  closeMenu();
  qIn.value = "";
  renderResults();
  dlg.showModal();
  qIn.focus();
}

qIn.addEventListener("input", renderResults);
qIn.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1); }
  else if (e.key === "Home") { e.preventDefault(); select(0); }
  else if (e.key === "End") { e.preventDefault(); select(items.length - 1); }
  else if (e.key === "Enter") { e.preventDefault(); choose(sel); }
});
resultsEl.addEventListener("click", (e) => { const li = e.target.closest(".sd__item"); if (li) choose(Number(li.dataset.i)); });
resultsEl.addEventListener("mousemove", (e) => { const li = e.target.closest(".sd__item"); if (li && Number(li.dataset.i) !== sel) select(Number(li.dataset.i), false); });
$("#sd-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (dlg.open) dlg.close(); else openSearch();
  }
});

/* ---------- Imagens opcionais (pasta assets) ---------- */
// logos que não existirem na pasta somem sem deixar o ícone de imagem quebrada
document.addEventListener("error", (e) => {
  const t = e.target;
  if (t && t.tagName === "IMG" && t.hasAttribute("data-opt")) t.remove();
}, true);
// se existir assets/assistant-logo.png, ele substitui o ícone do assistente
const botImg = new Image();
botImg.onload = () => {
  document.documentElement.style.setProperty("--bot-logo", `url("${botImg.src}")`);
  document.documentElement.classList.add("has-bot-logo");
};
botImg.src = "assets/assistant-logo.png";

/* ---------- Início ---------- */
show(parse(location.hash), { initial: true });

})();
</script>
