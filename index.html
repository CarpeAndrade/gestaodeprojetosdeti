  --font-body:"Open Sans","Segoe UI",system-ui,-apple-system,sans-serif;

  --r-lg:28px;
  --gutter:clamp(20px,4vw,40px);
  --focus:var(--navy);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--font-body);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
p{text-wrap:pretty}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
section[id]{scroll-margin-top:76px}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-80px;z-index:60;padding:10px 18px;border-radius:999px;background:var(--navy);color:var(--white);font-weight:700;text-decoration:none}
.skip:focus{top:12px}

.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-inline:var(--gutter)}
.section{padding-block:clamp(72px,9vw,128px)}

/* ---------- Tipografia ---------- */
h2{margin-top:18px;font-family:var(--font-display);font-weight:800;font-size:clamp(2.1rem,4.6vw,3.6rem);line-height:1.02;letter-spacing:-.028em;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:700;font-size:1.75rem;line-height:1.08;letter-spacing:-.01em}
.lede{max-width:34em;font-size:1.125rem;line-height:1.65;color:var(--muted)}
.tag{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--ice);color:var(--blue-deep);font-weight:700;font-size:.9375rem;line-height:1.4}
.band-ice .tag{background:var(--white)}
.band-navy .tag{background:var(--cyan);color:var(--navy)}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 30px;border:2px solid transparent;border-radius:999px;font-family:var(--font-body);font-weight:700;font-size:1.0625rem;line-height:1.2;text-decoration:none;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.btn svg{flex:none}
.btn--cyan{background:var(--cyan);color:var(--navy)}
.btn--cyan:hover{background:var(--cyan-soft)}
.btn--light{border-color:var(--white);color:var(--white)}
.btn--light:hover{background:var(--white);color:var(--blue)}
.btn--dark{border-color:var(--navy);color:var(--navy)}
.btn--dark:hover{background:var(--navy);color:var(--white)}
.btn--sm{padding:11px 22px;font-size:1rem}

kbd{font-family:var(--font-body);font-size:.8125rem;font-weight:700;line-height:1;padding:5px 9px;border-radius:8px;background:var(--ice);color:var(--navy)}

/* ---------- Cabeçalho ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--white);border-bottom:1px solid var(--line)}
.topbar__in{display:flex;align-items:center;gap:16px;min-height:76px}
.brand{margin-right:auto;display:inline-flex;align-items:center;font-family:var(--font-display);font-weight:800;font-size:1.95rem;line-height:1;letter-spacing:-.02em;text-decoration:none;color:var(--navy)}
.brand i{display:inline-block;width:.3em;height:.3em;margin:0 .1em;border-radius:50%;background:var(--cyan)}
.nav{display:flex;gap:4px}
.nav a{padding:10px 18px;border-radius:999px;font-weight:600;text-decoration:none}
.nav a:hover{background:var(--ice)}
.btn-search{display:inline-flex;align-items:center;gap:10px;padding:9px 12px 9px 16px;border:2px solid var(--navy);border-radius:999px;background:transparent;font-weight:700;cursor:pointer;transition:background-color .15s,color .15s}
.btn-search:hover{background:var(--navy);color:var(--white)}
.btn-search kbd{background:var(--ice)}
.burger{display:none;width:46px;height:46px;padding:0;border:2px solid var(--navy);border-radius:50%;background:transparent;cursor:pointer;place-items:center}

/* ---------- Início (faixa azul) ---------- */
.hero{background:var(--blue);color:var(--white);overflow:hidden;--focus:var(--white)}
.hero__grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(40px,5vw,72px);align-items:center;padding-block:clamp(48px,7vw,96px) 0}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(3.1rem,7.4vw,6.4rem);line-height:.92;letter-spacing:-.035em}
.hero .lead{margin-top:28px;max-width:33em;font-size:clamp(1.05rem,1.6vw,1.25rem);line-height:1.6;color:rgba(255,255,255,.94)}
.searchbar{margin-top:32px;display:flex;align-items:center;gap:14px;width:100%;max-width:620px;padding:15px 16px 15px 22px;border:0;border-radius:999px;background:var(--white);color:var(--muted);text-align:left;font-size:1rem;cursor:pointer}
.searchbar svg{flex:none;color:var(--blue)}
.searchbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchbar:hover{box-shadow:inset 0 0 0 3px var(--cyan)}
.actions{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px}

.stats{margin-top:clamp(48px,6vw,80px);padding-block:30px clamp(40px,5vw,56px);border-top:1.5px solid rgba(255,255,255,.38);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.stat{display:flex;flex-direction:column-reverse;gap:8px}
.stat dd{font-family:var(--font-display);font-weight:800;font-size:clamp(2.6rem,5vw,4.25rem);line-height:.95;letter-spacing:-.03em}
.stat dt{font-size:1rem;line-height:1.35;color:rgba(255,255,255,.92)}

/* Ilustração do quadro Kanban */
.hero__art{position:relative;width:100%;max-width:560px;margin-inline:auto 0;padding-bottom:84px}
.art-circle{position:absolute;right:-9%;top:-13%;width:76%;aspect-ratio:1;border-radius:50%;background:var(--cyan)}
.board{position:relative;padding:18px;border-radius:var(--r-lg);background:var(--white);color:var(--navy);transform:rotate(-2deg)}
.board__top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 6px 14px}
.board__title{font-family:var(--font-display);font-weight:800;font-size:1.5rem;line-height:1;letter-spacing:-.01em}
.board__meta{font-size:.8125rem;font-weight:600;color:var(--muted)}
.board__cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:16px;background:var(--ice)}
.col__h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px;font-size:.8125rem;font-weight:700;line-height:1.2}
.col__h b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--white);font-size:.6875rem}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:11px 11px 12px;border-radius:12px;background:var(--white)}
.chip{padding:2px 9px;border-radius:999px;font-size:.6875rem;font-weight:700;line-height:1.5}
.chip--blue{background:var(--blue);color:var(--white)}
.chip--cyan{background:var(--cyan);color:var(--navy)}
.chip--navy{background:var(--navy);color:var(--white)}
.chip--sky{background:var(--sky);color:var(--navy)}
.card__t{font-size:.84375rem;font-weight:700;line-height:1.3}
.meter{display:block;width:100%;height:6px;border-radius:3px;background:var(--sky);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.mini{position:absolute;left:-3%;bottom:0;width:44%;padding:14px 16px 12px;border-radius:20px;background:var(--navy);color:var(--white);transform:rotate(3deg)}
.mini__t{display:block;margin-bottom:6px;font-size:.8125rem;font-weight:700;line-height:1.3}
.mini svg{width:100%;height:auto}

/* ---------- Por que estudar (faixa branca) ---------- */
.pillars__head{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px clamp(32px,6vw,88px);align-items:end}
.pillars__list{margin-top:clamp(40px,6vw,72px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.arch{aspect-ratio:4/5;border-radius:50% 50% 28px 28px / 40% 40% 28px 28px;overflow:hidden}
.arch svg{width:100%;height:100%}
.arch--blue{background:var(--blue)}
.arch--cyan{background:var(--cyan)}
.arch--navy{background:var(--navy)}
.pillar h3{margin-top:26px}
.pillar p{margin-top:10px;max-width:22em;color:var(--muted)}

/* ---------- Módulos (faixa azul-gelo) ---------- */
.band-ice{background:var(--ice)}
.topics__head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px}
.topics{margin-top:clamp(36px,5vw,64px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.topic{position:relative;display:flex;flex-direction:column;justify-content:flex-start;gap:36px;min-height:252px;padding:26px 26px 30px;border-radius:var(--r-lg);scroll-margin-top:110px}
.topic__n{font-family:var(--font-display);font-weight:800;font-size:3.5rem;line-height:.9;letter-spacing:-.03em}
.topic h3{font-size:1.75rem}
.topic p{margin-top:10px;font-size:1rem;line-height:1.55}
.topic__a{text-decoration:none}
.topic__a::after{content:"";position:absolute;inset:0;border-radius:inherit}
.topic__a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.topic--blue{background:var(--blue);color:var(--white);--focus:var(--white)}
.topic--navy{background:var(--navy);color:var(--white);--focus:var(--white)}
.topic--cyan{background:var(--cyan);color:var(--navy)}
.topic--white{background:var(--white);color:var(--navy)}
.topic--blue p,.topic--navy p{color:rgba(255,255,255,.92)}
.topic--white p{color:var(--muted)}
.topic.is-hit{outline:4px solid var(--navy);outline-offset:5px}

/* ---------- Assistente (faixa azul-marinho) ---------- */
.band-navy{background:var(--navy);color:var(--white);--focus:var(--white)}
.assist__grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(40px,6vw,88px);align-items:center}
.assist p.lede{margin-top:22px;color:rgba(255,255,255,.9)}
.assist p.lede + .btn{margin-top:34px}
.chat{display:flex;flex-direction:column;gap:14px}
.chat__q{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.bubble{padding:18px 30px;border-radius:30px 30px 8px 30px;font-weight:700;font-size:1.25rem;line-height:1.3}
.bubble--white{background:var(--white);color:var(--navy)}
.bubble--cyan{background:var(--cyan);color:var(--navy)}
.bubble--blue{background:var(--blue);color:var(--white)}
.chat__bot{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.bot{flex:none;width:120px;height:120px;border-radius:50%;background:var(--white);overflow:hidden;display:grid;place-items:center}
.bot img{width:100%;height:100%;padding:10px;object-fit:contain}
.bot svg{width:100%;height:100%}
.typing{display:flex;gap:7px;padding:19px 24px;border-radius:28px 28px 28px 8px;background:rgba(255,255,255,.16)}
.typing i{width:10px;height:10px;border-radius:50%;background:var(--white);animation:blink 1.3s infinite both}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}

/* ---------- Sobre o projeto (faixa branca) ---------- */
.about__grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(36px,6vw,88px);align-items:start}
.about h2{font-size:clamp(1.9rem,3.8vw,3rem)}
.about p.lede{margin-top:22px}
.about p.lede + .btn{margin-top:30px}
.people{display:grid;gap:26px;padding:clamp(26px,3vw,38px);border-radius:var(--r-lg);background:var(--ice)}
.people div+div{padding-top:26px;border-top:1.5px solid var(--sky)}
.people dt{font-size:.9375rem;font-weight:700;color:var(--muted)}
.people dd{margin-top:6px;font-family:var(--font-display);font-weight:700;font-size:1.75rem;line-height:1.15;letter-spacing:-.01em}
.inst{margin-top:clamp(52px,7vw,88px);padding-top:clamp(32px,4vw,44px);border-top:1.5px solid var(--line)}
.inst__name{max-width:30em;font-family:var(--font-display);font-weight:700;font-size:clamp(1.35rem,2.4vw,1.75rem);line-height:1.15;letter-spacing:-.01em;color:var(--blue)}
.logos{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:150px;padding:20px;border:1.5px solid var(--line);border-radius:22px;background:var(--white);text-align:center}
.logo img{width:auto;max-width:100%;height:64px;object-fit:contain}
.logo figcaption{font-size:.9375rem;font-weight:600;line-height:1.3;color:var(--muted)}
.social{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px}

/* ---------- Rodapé (faixa azul) ---------- */
.footer{background:var(--blue);color:var(--white);padding-block:clamp(40px,5vw,56px);--focus:var(--white)}
.footer__in{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 48px}
.footer .brand{color:var(--white);margin:0}
.footer p{margin-top:12px;max-width:30em;font-size:.9375rem;line-height:1.55;color:rgba(255,255,255,.92)}
.footer__links{display:flex;flex-wrap:wrap;gap:8px 24px;font-weight:700}
.footer__links a{text-underline-offset:4px}

/* ---------- Busca (Ctrl K) ---------- */
dialog.search{width:min(660px,calc(100% - 32px));max-height:76vh;margin:12vh auto auto;padding:0;border:0;border-radius:var(--r-lg);background:var(--white);color:var(--navy);box-shadow:0 30px 80px rgba(11,31,75,.4);overflow:hidden}
dialog.search[open]{display:flex;flex-direction:column}
dialog.search::backdrop{background:rgba(11,31,75,.64)}
.sd__field{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1.5px solid var(--line)}
.sd__field svg{flex:none;color:var(--blue)}
.sd__field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:1.125rem;color:var(--navy);caret-color:var(--blue)}
.sd__field input::placeholder{color:var(--muted);opacity:1}
.sd__close{padding:6px 10px;border:0;border-radius:8px;background:var(--ice);font-size:.8125rem;font-weight:700;cursor:pointer}
.sd__list{overflow:auto;padding:10px}
.sd__item{display:flex;gap:16px;align-items:flex-start;padding:12px 14px;border-radius:16px;cursor:pointer}
.sd__item[aria-selected="true"]{background:var(--ice)}
.sd__n{flex:none;min-width:2.1ch;font-family:var(--font-display);font-weight:800;font-size:1.5rem;line-height:1.1;color:var(--blue)}
.sd__t{display:block;font-weight:700;line-height:1.35}
.sd__d{display:block;font-size:.9375rem;line-height:1.45;color:var(--muted)}
.sd__empty{padding:28px 24px 32px;color:var(--muted)}

/* ---------- Telas menores ---------- */
@media (max-width:980px){
  .hero__grid{grid-template-columns:minmax(0,1fr)}
  .hero__art{margin-inline:auto;max-width:540px}
  .pillars__head,.assist__grid,.about__grid{grid-template-columns:minmax(0,1fr)}
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chat{max-width:520px}
}
@media (max-width:820px){
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:2px;padding:8px var(--gutter) 18px;background:var(--white);border-bottom:1px solid var(--line)}
  .nav.is-open{display:flex}
  .nav a{padding:14px 16px;font-size:1.125rem}
  .burger{display:inline-grid}
  .btn-search{width:46px;height:46px;padding:0;justify-content:center}
  .btn-search .btn-search__txt,.btn-search kbd{display:none}
}
@media (max-width:700px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}
}
@media (max-width:640px){
  .pillars__list{grid-template-columns:minmax(0,1fr);gap:32px}
  .pillar{display:grid;grid-template-columns:128px minmax(0,1fr);gap:20px;align-items:center}
  .pillar h3{margin-top:0}
  .pillar p{margin-top:6px}
  .topics{grid-template-columns:minmax(0,1fr)}
  .topic{min-height:0}
  .logos{grid-template-columns:minmax(0,1fr)}
  .logo{min-height:0;flex-direction:row;justify-content:flex-start;text-align:left;gap:18px;padding:16px 20px}
  .logo img{flex:none;max-width:42%}
}
@media (max-width:560px){
  .board__cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col:nth-child(3){display:none}
  .searchbar{padding:14px 16px 14px 18px}
  .searchbar span{white-space:normal;line-height:1.35}
  .searchbar kbd{display:none}
  .actions .btn{flex:1 1 100%}
  .bot{width:88px;height:88px}
  .bubble{padding:16px 26px;font-size:1.125rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* =====================================================================
   Partes compartilhadas pelas páginas internas (tópicos, assistente, 404)
   ===================================================================== */
:root{
  --cyan-tint:#D4F2FC;
}

/* Menu: página atual */
.nav a[aria-current="page"]{background:var(--ice);color:var(--blue-deep)}
.footer__links a[aria-current="page"]{text-decoration:underline;text-decoration-thickness:2px}

/* Botões extras (usados em faixas claras) */
.btn--navy{background:var(--navy);color:var(--white)}
.btn--navy:hover{background:var(--blue)}
.btn--blue{background:var(--blue);color:var(--white)}
.btn--blue:hover{background:var(--blue-deep)}

/* Foco dos botões de cor chapada sobre a faixa azul e a marinho */
.hero .btn:focus-visible,.band-navy .btn:focus-visible{outline-color:var(--white)}

/* ---------- Início: cards dos 12 tópicos (mesmo visual, agora com link) ---------- */
.topic h3{font-size:1.6rem;line-height:1.08}
.topic__go{position:absolute;top:24px;right:24px;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;transition:transform .2s}
.topic__go svg{width:22px;height:22px}
.topic--blue .topic__go{background:var(--white);color:var(--blue)}
.topic--navy .topic__go{background:var(--white);color:var(--navy)}
.topic--cyan .topic__go{background:var(--navy);color:var(--cyan)}
.topic--white .topic__go{background:var(--blue);color:var(--white)}
.topic:hover .topic__go{transform:scale(1.12) rotate(8deg)}
.topic:focus-within{outline:3px solid var(--focus);outline-offset:4px}
.topic__a:focus-visible{outline:0}
.topic__a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* Perguntas de exemplo (agora são links para o assistente) */
a.bubble{display:inline-block;text-decoration:none;transition:transform .15s}
a.bubble:hover{transform:translateY(-2px)}
.bubble--ice{background:var(--ice);color:var(--navy)}

/* ---------- Avatar do assistente ---------- */
.bot-av{flex:none;border-radius:50%;background:var(--white);overflow:hidden}
.has-bot-logo .bot-av{background:var(--white) var(--bot-logo) center/74% no-repeat}
.has-bot-logo .bot-av svg{display:none}
.bot-av--sm{width:44px;height:44px}
.bot-av--sm svg{width:100%;height:100%}

/* ---------- Tabelas (tópicos e respostas do assistente) ---------- */
.tablewrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:20px;background:var(--white);color:var(--navy)}
.tablewrap table{width:100%;border-collapse:collapse;font-size:.96875rem;line-height:1.5}
.tablewrap th,.tablewrap td{padding:14px 18px;text-align:left;vertical-align:top}
.tablewrap thead th{background:var(--navy);color:var(--white);font-family:var(--font-display);font-weight:700;font-size:1.0625rem;line-height:1.2;white-space:nowrap}
.tablewrap tbody th{font-weight:700}
.tablewrap tbody tr:nth-child(even){background:var(--ice)}
.tablewrap tbody tr+tr>*{border-top:1px solid var(--line)}
.tablewrap--sm table{font-size:.875rem}
.tablewrap--sm th,.tablewrap--sm td{padding:10px 12px}
.tablewrap--sm thead th{font-size:.9375rem}

/* ---------- Links externos em forma de pílula ---------- */
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:2px solid var(--navy);border-radius:999px;color:var(--navy);font-weight:700;font-size:.9375rem;line-height:1.2;text-decoration:none;transition:background-color .15s,color .15s}
.pill:hover{background:var(--navy);color:var(--white)}
.pill svg{flex:none;width:16px;height:16px}

/* ---------- 404 ---------- */
.nf{padding-block:clamp(72px,10vw,150px)}
.nf__n{display:block;font-family:var(--font-display);font-weight:800;font-size:clamp(6rem,20vw,13rem);line-height:.8;letter-spacing:-.05em;color:var(--blue)}
.nf h1{margin-top:28px;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1;letter-spacing:-.025em}
.nf p{margin-top:16px;max-width:30em;font-size:1.125rem;color:var(--muted)}
.nf .actions{margin-top:30px}

/* ---------- Bolhas de resposta do assistente (usadas também em páginas) ---------- */
.chip-q{display:inline-flex;align-items:center;padding:8px 16px;border:2px solid var(--blue);border-radius:999px;background:var(--white);color:var(--blue-deep);font-family:var(--font-body);font-weight:700;font-size:.9375rem;line-height:1.25;text-align:left;text-decoration:none;cursor:pointer;transition:background-color .15s,color .15s}
.chip-q:hover{background:var(--blue);color:var(--white)}

/* Cabeçalho fixo respeita a área segura do celular (sem efeito em computador) */
.topbar{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--white);z-index:40}


/* =====================================================================
   Página de tópico: faixa de título na cor do card, sumário, seções,
   pontos-chave em faixa marinho, pergunta ao assistente e anterior/próximo
   ===================================================================== */

/* ---------- Faixa de título (cor do card do tópico) ---------- */
.tp-hero{--bg:var(--blue);--ink:var(--white);--art:var(--cyan);--art-ink:var(--navy);--dot:var(--white);--dot2:var(--navy);
  background:var(--bg);color:var(--ink);overflow:hidden;--focus:var(--white)}
.tp-hero--navy{--bg:var(--navy);--art:var(--blue);--art-ink:var(--white);--dot:var(--cyan);--dot2:var(--white)}
.tp-hero--cyan{--bg:var(--cyan);--ink:var(--navy);--art:var(--navy);--art-ink:var(--cyan);--dot:var(--white);--dot2:var(--blue);--focus:var(--navy)}
.tp-hero--white{--bg:var(--ice);--ink:var(--navy);--art:var(--blue);--art-ink:var(--white);--dot:var(--cyan);--dot2:var(--navy);--focus:var(--navy)}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding-top:22px;font-size:.9375rem;font-weight:600;line-height:1.4}
.crumbs a{text-underline-offset:4px;text-decoration-thickness:1.5px}
.crumbs a:hover{text-decoration-thickness:3px}
.crumbs [aria-hidden]{opacity:.65}

.tp-hero__grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(32px,5vw,72px);align-items:end;padding-top:clamp(28px,4vw,52px)}
.tp-hero__text{padding-bottom:clamp(40px,6vw,80px)}
.tp-hero h1{margin-top:20px;font-family:var(--font-display);font-weight:800;font-size:clamp(2.5rem,5.6vw,4.6rem);line-height:.96;letter-spacing:-.03em;text-wrap:balance}
.tp-hero__lead{margin-top:24px;max-width:32em;font-size:clamp(1.05rem,1.5vw,1.2rem);line-height:1.6}
.tp-hero .actions{margin-top:30px}
.tp-hero--blue .tag{background:var(--ice);color:var(--blue-deep)}
.tp-hero--navy .tag{background:var(--cyan);color:var(--navy)}
.tp-hero--cyan .tag,.tp-hero--white .tag{background:var(--white);color:var(--blue-deep)}
.tp-hero--blue .btn--ghost,.tp-hero--navy .btn--ghost{border-color:var(--white);color:var(--white)}
.tp-hero--blue .btn--ghost:hover,.tp-hero--navy .btn--ghost:hover{background:var(--white);color:var(--blue)}
.tp-hero--cyan .btn--ghost,.tp-hero--white .btn--ghost{border-color:var(--navy);color:var(--navy)}
.tp-hero--cyan .btn--ghost:hover,.tp-hero--white .btn--ghost:hover{background:var(--navy);color:var(--white)}
.tp-hero--cyan .btn:focus-visible,.tp-hero--white .btn:focus-visible{outline-color:var(--navy)}

/* arco com o número do tópico, encostado na base da faixa */
.tp-art{position:relative;justify-self:end;width:min(100%,360px);aspect-ratio:4/5;border-radius:50% 50% 0 0 / 38% 38% 0 0;background:var(--art);color:var(--art-ink);display:grid;place-items:center}
.tp-art b{margin-top:22%;font-family:var(--font-display);font-weight:800;font-size:clamp(6.5rem,13vw,11.5rem);line-height:.8;letter-spacing:-.05em}
.tp-art i{position:absolute;border-radius:50%}
.tp-art i:nth-child(1){width:30%;aspect-ratio:1;left:-12%;top:20%;background:var(--dot)}
.tp-art i:nth-child(2){width:11%;aspect-ratio:1;left:17%;bottom:7%;background:var(--dot2)}

/* ---------- Corpo: sumário + texto ---------- */
.tp-body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:start;padding-block:clamp(44px,6vw,84px) clamp(56px,7vw,100px)}
.toc{position:sticky;top:100px}
.toc__t{font-family:var(--font-display);font-weight:800;font-size:1.25rem;line-height:1.1;letter-spacing:-.01em}
.toc ol{margin-top:16px;border-left:2px solid var(--line)}
.toc a{display:block;margin-left:-2px;padding:8px 14px;border-left:2px solid transparent;color:var(--muted);font-weight:600;font-size:.9375rem;line-height:1.35;text-decoration:none}
.toc a:hover{color:var(--navy)}
.toc a[aria-current]{border-left-color:var(--blue);color:var(--navy);font-weight:700}

.tp-main{min-width:0}
.tp-sec{scroll-margin-top:100px}
.tp-sec+.tp-sec{margin-top:clamp(44px,5.5vw,72px)}
.tp-sec h2{margin-top:0;font-size:clamp(1.75rem,3.2vw,2.5rem);line-height:1.06;letter-spacing:-.025em}
.tp-sec>*+*{margin-top:22px}
.tp-sec>h2+*{margin-top:20px}
.tp-sec--intro>*+*{margin-top:0}
.tp-intro{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,2.2vw,1.65rem);line-height:1.4;letter-spacing:-.005em;text-wrap:pretty}
.tp-p{max-width:44em;font-size:1.0625rem;line-height:1.75}
.tp-sec>.tablewrap+.tp-p{font-size:.96875rem;color:var(--muted)}

.tp-list{max-width:48em}
.tp-list li{position:relative;padding:15px 0 15px 36px;border-top:1.5px solid var(--line);font-size:1.0625rem;line-height:1.55}
.tp-list li:last-child{border-bottom:1.5px solid var(--line)}
.tp-list li::before{content:"";position:absolute;left:5px;top:calc(15px + .775em - 6px);width:12px;height:12px;border-radius:50%;background:var(--cyan)}
.tp-p+.tp-list{margin-top:18px}

.tp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tp-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:24px 24px 26px;border-radius:24px;background:var(--ice)}
.tp-card:nth-child(3n+2){background:var(--cyan-tint)}
.tp-card:nth-child(3n){background:var(--sky)}
.tp-card:last-child:nth-child(odd){grid-column:1/-1}
.tp-card::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--blue)}
.tp-card:nth-child(3n+2)::before{background:var(--navy)}
.tp-card:nth-child(3n)::before{background:var(--cyan)}
.tp-card h3{margin-top:4px;font-size:1.4rem;line-height:1.1}
.tp-card p{font-size:1rem;line-height:1.6;color:var(--navy)}

.tp-linkslabel{font-weight:700;color:var(--muted)}
.tp-sec>.tp-linkslabel+.pills{margin-top:12px}
.tp-sec>.tp-cards+.tp-linkslabel{margin-top:32px}

/* ---------- Pontos-chave (faixa marinho) ---------- */
.tp-keys{background:var(--navy);color:var(--white);--focus:var(--white);padding-block:clamp(56px,7vw,100px);scroll-margin-top:76px}
.tp-keys .tag{background:var(--cyan);color:var(--navy)}
.keys{margin-top:clamp(32px,5vw,56px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,3.5vw,48px);counter-reset:k}
.keys li{padding-top:24px;border-top:3px solid var(--cyan);counter-increment:k}
.keys li::before{content:counter(k);display:block;margin-bottom:14px;font-family:var(--font-display);font-weight:800;font-size:3.75rem;line-height:.9;letter-spacing:-.03em;color:var(--cyan)}
.keys p{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,2vw,1.6rem);line-height:1.25;letter-spacing:-.005em}

/* ---------- Pergunte ao assistente (faixa branca) ---------- */
.tp-ask .assist__grid{align-items:center}
.tp-ask p.lede{margin-top:22px}
.tp-ask p.lede+.btn{margin-top:30px}
.tp-ask .chat__q{max-width:560px;margin-left:auto}

/* ---------- Anterior / próximo (faixa azul-gelo) ---------- */
.tp-pager{padding-block:clamp(48px,6vw,84px)}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pg{display:flex;flex-direction:column;justify-content:space-between;gap:30px;min-height:230px;text-decoration:none}
.pg__dir{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;line-height:1.2}
.pg__dir svg{width:20px;height:20px}
.pg--prev .pg__dir svg{transform:rotate(180deg)}
.pg--next{text-align:left}
.pg__t{display:block;margin-top:14px;font-family:var(--font-display);font-weight:700;font-size:1.6rem;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.pg:hover .pg__t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.pg--next .pg__dir{justify-content:flex-start}

/* ---------- Telas menores ---------- */
@media (max-width:1040px){
  .tp-body{grid-template-columns:minmax(0,1fr);gap:28px}
  .toc{position:static;padding:20px 22px 22px;border-radius:24px;background:var(--ice)}
  .toc ol{display:flex;flex-wrap:wrap;gap:8px;border-left:0}
  .toc a{margin:0;padding:7px 14px;border:2px solid var(--navy);border-radius:999px;color:var(--navy);font-weight:700}
  .toc a:hover{background:var(--navy);color:var(--white)}
  .toc a[aria-current]{border-color:var(--blue);background:var(--blue);color:var(--white)}
}
@media (max-width:820px){
  .tp-hero__grid{grid-template-columns:minmax(0,1fr)}
  .tp-art{display:none}
  .tp-hero__text{padding-bottom:44px}
  .keys{grid-template-columns:minmax(0,1fr);gap:28px}
  .keys li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 14px;align-items:start;padding-top:18px}
  .keys li::before{margin:0;font-size:3rem}
  .tp-ask .chat__q{margin-left:0;align-items:flex-start}
}
@media (max-width:640px){
  .tp-cards{grid-template-columns:minmax(0,1fr)}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pg{min-height:0;gap:22px}
  .tp-hero .actions .btn{flex:1 1 100%}

  /* tabelas viram blocos legíveis no celular */
  .tablewrap{overflow:visible;border:0;background:transparent;border-radius:0}
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap th,.tablewrap td{display:block}
  .tablewrap thead{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tablewrap tbody tr{margin-top:12px;padding:6px 0 10px;border:1.5px solid var(--line);border-radius:20px;background:var(--white)}
  .tablewrap tbody tr:nth-child(even){background:var(--ice)}
  .tablewrap tbody tr+tr>*{border-top:0}
  .tablewrap tbody th{padding:10px 18px 4px;font-family:var(--font-display);font-weight:700;font-size:1.2rem;line-height:1.2}
  .tablewrap td{display:grid;grid-template-columns:minmax(6.2rem,32%) minmax(0,1fr);gap:4px 14px;padding:6px 18px}
  .tablewrap td::before{content:attr(data-label);font-weight:700;font-size:.875rem;line-height:1.5;color:var(--muted)}
  .tablewrap--sm tbody tr{margin-top:8px}
}


/* =====================================================================
   Página do assistente: faixa marinho, painel de conversa, respostas
   ===================================================================== */
.as-hero{background:var(--navy);color:var(--white);--focus:var(--white);padding-block:clamp(40px,6vw,84px) clamp(110px,13vw,168px)}
.as-hero .tag{background:var(--cyan);color:var(--navy)}
.as-hero h1{margin-top:18px;max-width:13em;font-family:var(--font-display);font-weight:800;font-size:clamp(2.6rem,6vw,5rem);line-height:.96;letter-spacing:-.03em;text-wrap:balance}
.as-hero .lede{margin-top:22px;max-width:36em;color:rgba(255,255,255,.92)}

.as-main{position:relative;z-index:1;margin-top:calc(-1 * clamp(70px,9vw,112px));padding-bottom:clamp(40px,5vw,64px)}
.as-panel{position:relative;max-width:920px;margin-inline:auto;border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--white);color:var(--navy);--focus:var(--navy)}
.as-head{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1.5px solid var(--line)}
.as-head__t{flex:1;min-width:0}
.as-head__t b{display:block;font-family:var(--font-display);font-weight:700;font-size:1.3rem;line-height:1.1;letter-spacing:-.01em}
.as-head__t span{display:block;margin-top:2px;font-size:.875rem;line-height:1.35;color:var(--muted)}
.as-clear{flex:none;padding:8px 16px;border:2px solid var(--navy);border-radius:999px;background:transparent;font-weight:700;font-size:.9375rem;line-height:1.2;cursor:pointer;transition:background-color .15s,color .15s}
.as-clear:hover{background:var(--navy);color:var(--white)}

.msgs{display:grid;gap:18px;min-height:280px;padding:26px 24px 30px}
.msg{display:flex;align-items:flex-end;gap:12px;min-width:0}
.msg--user{justify-content:flex-end}
.bub{min-width:0;max-width:calc(100% - 56px);padding:16px 22px 18px;border-radius:26px 26px 26px 8px;background:var(--ice);color:var(--navy);font-size:1.0625rem;line-height:1.6}
.bub>*+*{margin-top:14px}
.msg--user .bub{max-width:min(100%,560px);padding:14px 22px;border-radius:26px 26px 8px 26px;background:var(--blue);color:var(--white);font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.msgs .typing{padding:18px 22px;border-radius:26px 26px 26px 8px;background:var(--ice)}
.msgs .typing i{background:var(--blue)}

/* respostas */
.ans__lead{font-weight:600}
.ans-card{padding:16px 18px 18px;border-radius:18px;background:var(--white)}
.ans-card>*+*{margin-top:8px}
.ans__t{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1.15;letter-spacing:-.005em}
.ans-card p{font-size:1rem;line-height:1.6}
.ans-card ul{display:grid;gap:7px;margin-top:10px}
.ans-card li{position:relative;padding-left:20px;font-size:.96875rem;line-height:1.5}
.ans-card li::before{content:"";position:absolute;left:3px;top:.6em;width:9px;height:9px;border-radius:50%;background:var(--cyan)}
.ans-dl{display:grid;gap:10px;margin-top:10px}
.ans-dl div{display:grid;grid-template-columns:minmax(7.5rem,30%) minmax(0,1fr);gap:2px 14px}
.ans-dl dt{font-weight:700;font-size:.875rem;line-height:1.55;color:var(--muted)}
.ans-dl dd{font-size:1rem;line-height:1.55}
.ans-note{font-size:.875rem;line-height:1.5;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cmp .ans-card{height:100%}
.bub .tablewrap{margin-top:10px}

.ans-src,.ans-follow,.ans-srcs{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ans-src>span,.ans-follow>span{margin-right:2px;font-weight:700;font-size:.875rem;line-height:1.3;color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:4px 14px 4px 4px;border:1.5px solid var(--line);border-radius:999px;background:var(--white);color:var(--navy);font-weight:700;font-size:.875rem;line-height:1.25;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s}
.src>span:last-child{min-width:0}
.src__n{flex:none;display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:var(--blue);color:var(--white);font-family:var(--font-display);font-weight:800;font-size:.875rem;line-height:1}
.src:hover{border-color:var(--navy);background:var(--navy);color:var(--white)}
.src:hover .src__n{background:var(--cyan);color:var(--navy)}
.bub .chip-q{font-size:.875rem;padding:7px 14px}

/* caixa de pergunta (fica visível ao rolar a conversa) */
.composer{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;padding:14px 18px;border-top:1.5px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg);background:var(--white)}
.composer input{flex:1;min-width:0;padding:13px 22px;border:2px solid var(--navy);border-radius:999px;background:var(--white);color:var(--navy);font:inherit;font-size:1.0625rem;line-height:1.3;caret-color:var(--blue)}
.composer input::placeholder{color:var(--muted);opacity:1}
.composer input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.composer .btn{flex:none;padding:12px 26px}
.as-note{max-width:920px;margin:18px auto 0;padding-inline:8px;font-size:.9375rem;line-height:1.55;color:var(--muted);text-align:center}

.as-topics{padding-block:clamp(56px,7vw,96px)}
.as-topics h2{font-size:clamp(1.9rem,3.8vw,3rem)}
.as-topics .ans-srcs{margin-top:clamp(24px,3vw,36px);gap:10px}
.as-topics .src{padding:6px 18px 6px 6px;font-size:1rem}
.as-topics .src__n{min-width:34px;height:34px;font-size:1rem}

@media (max-width:820px){
  .cmp{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .as-main>.wrap{padding-inline:12px}
  .as-head{padding:14px 16px}
  .msgs{padding:20px 12px 24px;gap:16px}
  .msg{gap:6px}
  .msgs .bot-av--sm{width:34px;height:34px}
  .bub{max-width:calc(100% - 40px);padding:14px 14px 16px;font-size:1rem}
  .msg--user .bub{padding:12px 18px}
  .ans-card{padding:12px 12px 14px}
  .ans-dl div{grid-template-columns:minmax(0,1fr)}
  /* tabelas dentro das respostas: rótulo em cima, valor embaixo (a bolha é estreita) */
  .tablewrap--sm tbody tr{margin-top:8px;padding:4px 0 8px;border-radius:14px}
  .tablewrap--sm tbody th{padding:8px 12px 2px;font-size:1.05rem}
  .tablewrap--sm td{grid-template-columns:minmax(0,1fr);gap:0;padding:4px 12px}
  .tablewrap--sm td::before{font-size:.8125rem;line-height:1.4}
  .composer{padding:12px}
  .composer .btn{width:50px;height:50px;padding:0}
  .composer .btn span{display:none}
  .as-clear{padding:7px 12px;font-size:.875rem}
}

.msg{scroll-margin-top:96px}

</style>
</head>

criam riscos que precisam ser gerenciados."}]},{"heading":"Ciclo de vida de um projeto","table":{"headers":["Fase","Foco principal","Exemplos de entregas"],"rows":[["Iniciação","Justificar e autorizar o projeto","Termo de abertura, business case"],["Planejamento","Definir como o trabalho será feito","EAP, cronograma, orçamento, plano de riscos"],["Execução","Produzir as entregas","Código, infraestrutura, documentação"],["Monitoramento e controle","Comparar planejado x realizado","Relatórios de status, indicadores"],["Encerramento","Formalizar aceite e aprender","Termo de aceite, lições aprendidas"]]}}],"takeaways":["Projeto é temporário e único; operação é contínua.","O sucesso vai além do prazo e custo: envolve valor entregue ao negócio.","Projetos de TI têm alta incerteza, por isso exigem adaptação constante."]},{"slug":"abordagens-tradicionais-e-ageis","number":"02","title":"Abordagens tradicionais e ágeis","short":"PMBOK, PRINCE2, Scrum, Kanban, Lean e XP: como cada abordagem organiza o trabalho.","intro":"Existem duas grandes famílias de abordagens: as tradicionais (preditivas), que planejam o projeto em detalhes no início, e as ágeis (adaptativas), que entregam valor em ciclos curtos e acolhem mudanças. Conhecer as duas permite escolher — ou combinar — a mais adequada a cada contexto.","sections":[{"heading":"Abordagens tradicionais","cards":[{"title":"PMBOK (PMI)","text":"Guia de boas práticas do Project Management Institute. A 7ª edição é baseada em 12 princípios e 8 domínios de desempenho (stakeholders, equipe, abordagem de desenvolvimento, planejamento, trabalho do projeto, entrega, medição e incerteza). É a base da certificação PMP."},{"title":"PRINCE2","text":"Método estruturado de origem britânica, baseado em 7 princípios, 7 temas e 7 processos. Destaca a justificativa contínua do negócio, gestão por estágios e por exceção, e papéis e responsabilidades bem definidos."},{"title":"Cascata (Waterfall)","text":"Modelo sequencial: requisitos → design → implementação → testes → implantação. Funciona bem quando o escopo é estável e bem compreendido."}]},{"heading":"Abordagens ágeis","text":"O Manifesto Ágil (2001) valoriza indivíduos e interações, software funcionando, colaboração com o cliente e resposta a mudanças.","cards":[{"title":"Scrum","text":"Framework com sprints de 1 a 4 semanas, três papéis (Product Owner, Scrum Master e Desenvolvedores), eventos (Planning, Daily, Review, Retrospectiva) e artefatos (Product Backlog, Sprint Backlog e Incremento)."},{"title":"Kanban","text":"Método de fluxo contínuo que visualiza o trabalho em um quadro, limita o trabalho em progresso (WIP) e busca melhorar o tempo de ciclo e a vazão de entregas."},{"title":"Lean","text":"Originado no Sistema Toyota de Produção, foca em eliminar desperdícios (esperas, retrabalho, funcionalidades não usadas) e maximizar o valor para o cliente."},{"title":"XP (Extreme Programming)","text":"Conjunto de práticas de engenharia: programação em pares, TDD, integração contínua, refatoração, design simples e entregas pequenas e frequentes."}]},{"heading":"Comparativo rápido","table":{"headers":["Critério","Tradicional","Ágil"],"rows":[["Planejamento","Detalhado no início","Contínuo e incremental"],["Escopo","Fixo, mudanças controladas","Flexível, priorizado pelo valor"],["Entregas","Ao final do projeto","Frequentes, a cada ciclo"],["Cliente","Participa no início e no fim","Colabora durante todo o projeto"],["Documentação","Extensa e formal","Suficiente e enxuta"],["Indicado para","Escopo estável, alta regulação","Alta incerteza, inovação"]]}}],"takeaways":["Não existe abordagem universalmente melhor: o contexto decide.","PMBOK e PRINCE2 trazem governança; Scrum, Kanban, Lean e XP trazem adaptabilidade.","Práticas de engenharia (XP) sustentam a agilidade no longo prazo."]},{"slug":"estruturacao-de-projetos","number":"03","title":"Estruturação de projetos","short":"Escopo, cronograma, custo, qualidade e comunicação — os pilares do planejamento.","intro":"Estruturar um projeto é transformar uma ideia em um plano executável. Os cinco pilares — escopo, cronograma, custo, qualidade e comunicação — estão interligados: alterar um deles afeta os demais (a famosa restrição tripla, ampliada).","sections":[{"heading":"Escopo","text":"Define o que será (e o que não será) entregue. Em projetos preditivos, usa-se a EAP (Estrutura Analítica do Projeto) para decompor o trabalho em pacotes gerenciáveis. Em projetos ágeis, o escopo vive no Product Backlog, organizado em épicos e histórias de usuário com critérios de aceite.","bullets":["Declaração de escopo com objetivos, entregas, premissas e restrições.","Controle de mudanças para evitar o scope creep (aumento descontrolado do escopo).","Definição de Pronto (DoD) para alinhar o que significa 'concluído'."]},{"heading":"Cronograma","text":"Organiza as atividades no tempo. Técnicas comuns: diagrama de Gantt, método do caminho crítico (CPM), PERT para estimativas com incerteza, e no ágil, roadmaps, releases e velocidade da equipe."},{"heading":"Custo","text":"Inclui estimativas (análoga, paramétrica, bottom-up), definição do orçamento e controle. Em TI, considere licenças, infraestrutura em nuvem, horas da equipe, treinamento e custos de manutenção (TCO). A Análise de Valor Agregado (EVM) ajuda a medir desempenho de custo e prazo."},{"heading":"Qualidade","text":"Garante que a entrega atenda aos requisitos e seja adequada ao uso.","bullets":["Testes automatizados (unitários, integração, ponta a ponta).","Revisão de código e padrões de codificação.","Requisitos não funcionais: desempenho, segurança, acessibilidade, disponibilidade.","Normas e modelos de referência: ISO/IEC 25010, CMMI, MPS.BR."]},{"heading":"Comunicação","text":"Estudos indicam que a maior parte do tempo de um gerente de projetos é dedicada à comunicação. Um plano de comunicação define quem precisa de qual informação, quando, em que formato e por qual canal.","table":{"headers":["Público","Informação","Frequência","Canal"],"rows":[["Patrocinador","Status executivo, riscos críticos","Quinzenal","Reunião + relatório"],["Equipe","Prioridades e impedimentos","Diária","Daily / chat"],["Usuários-chave","Demonstração de entregas","A cada sprint","Sprint Review"],["Áreas de apoio","Mudanças e implantações","Sob demanda","E-mail / portal"]]}}],"takeaways":["Escopo claro é a base para estimar prazo e custo.","Qualidade deve ser planejada, não apenas inspecionada no final.","Comunicação é a atividade mais importante do gestor de projetos."]},{"slug":"riscos-stakeholders-e-entregas","number":"04","title":"Gestão de riscos, stakeholders e entregas","short":"Antecipar ameaças, engajar as pessoas certas e garantir entregas de valor.","intro":"Riscos, partes interessadas e entregas formam um triângulo crítico: riscos mal gerenciados ameaçam as entregas, e stakeholders desengajados aumentam os riscos. Gerenciar os três de forma integrada é essencial para o sucesso.","sections":[{"heading":"Processo de gestão de riscos","bullets":["Identificar: brainstorming, checklists, lições aprendidas, análise SWOT.","Analisar: probabilidade x impacto (matriz de riscos) e, quando possível, análise quantitativa.","Planejar respostas: evitar, transferir, mitigar ou aceitar (ameaças); explorar, compartilhar, melhorar ou aceitar (oportunidades).","Monitorar: revisar o registro de riscos periodicamente e acompanhar gatilhos."]},{"heading":"Riscos comuns em projetos de TI","cards":[{"title":"Requisitos instáveis","text":"Mudanças constantes sem controle geram retrabalho e atrasos."},{"title":"Dívida técnica","text":"Atalhos técnicos acumulados reduzem a velocidade e a qualidade futura."},{"title":"Segurança da informação","text":"Vulnerabilidades, vazamentos e não conformidade com a LGPD."},{"title":"Dependência de pessoas-chave","text":"Conhecimento concentrado em poucos profissionais."},{"title":"Integrações","text":"APIs de terceiros instáveis ou sistemas legados mal documentados."},{"title":"Fornecedores","text":"Atrasos, mudanças de preço ou descontinuação de produtos."}]},{"heading":"Gestão de stakeholders","text":"Stakeholders são pessoas ou grupos que afetam ou são afetados pelo projeto: patrocinadores, usuários, equipe, áreas jurídicas, fornecedores, órgãos reguladores. A matriz poder x interesse ajuda a definir estratégias.","table":{"headers":["Quadrante","Estratégia"],"rows":[["Alto poder / alto interesse","Gerenciar de perto, envolver nas decisões"],["Alto poder / baixo interesse","Manter satisfeito, informar o essencial"],["Baixo poder / alto interesse","Manter informado, ouvir feedback"],["Baixo poder / baixo interesse","Monitorar com esforço mínimo"]]}},{"heading":"Gestão de entregas","text":"Entregas devem ser validadas com critérios de aceite claros. Práticas modernas como entrega contínua, feature flags e releases incrementais reduzem o risco de grandes implantações ('big bang') e aceleram o retorno de valor."}],"takeaways":["Risco é incerteza — pode ser ameaça ou oportunidade.","Mapeie stakeholders cedo e revise o mapa ao longo do projeto.","Entregas pequenas e frequentes reduzem riscos e aumentam a confiança."]},{"slug":"metodos-hibridos","number":"05","title":"Métodos híbridos e flexíveis","short":"Combinar previsibilidade e agilidade para contextos complexos.","intro":"Muitas organizações precisam de governança e previsibilidade (orçamentos anuais, contratos, auditorias) e, ao mesmo tempo, de agilidade para lidar com incerteza. Os métodos híbridos combinam elementos das abordagens preditivas e adaptativas para atender a essa realidade.","sections":[{"heading":"Quando usar uma abordagem híbrida","bullets":["Projetos com partes estáveis (infraestrutura, hardware) e partes incertas (software, UX).","Ambientes regulados que exigem documentação formal e marcos contratuais.","Organizações em transição de modelos tradicionais para ágeis.","Programas grandes com várias equipes e dependências entre elas."]},{"heading":"Modelos e frameworks","cards":[{"title":"Water-Scrum-Fall","text":"Planejamento e aprovação tradicionais, desenvolvimento em sprints e implantação controlada."},{"title":"Scrumban","text":"Une a cadência e os papéis do Scrum com o fluxo contínuo e os limites de WIP do Kanban."},{"title":"Disciplined Agile (DA)","text":"Kit de ferramentas do PMI que ajuda a escolher o 'modo de trabalho' mais adequado a cada contexto."},{"title":"SAFe","text":"Framework para agilidade em escala, com Agile Release Trains, PI Planning e portfólio Lean."},{"title":"LeSS e Nexus","text":"Escalam o Scrum para várias equipes trabalhando em um mesmo produto."},{"title":"PRINCE2 Agile","text":"Combina a governança do PRINCE2 com a entrega ágil no nível das equipes."}]},{"heading":"Contextos complexos — o modelo Cynefin","text":"O framework Cynefin ajuda a decidir a abordagem conforme o tipo de problema.","table":{"headers":["Domínio","Característica","Abordagem sugerida"],"rows":[["Claro","Causa e efeito óbvios","Boas práticas, processos padronizados"],["Complicado","Exige análise de especialistas","Planejamento preditivo"],["Complexo","Causa e efeito só percebidos depois","Experimentação, ágil"],["Caótico","Sem relação aparente","Agir rápido para estabilizar"]]}}],"takeaways":["Híbrido não é 'meio-termo': é escolher conscientemente o que funciona.","Use preditivo onde há estabilidade e adaptativo onde há incerteza.","Frameworks de escala ajudam programas com muitas equipes."]},{"slug":"ferramentas","number":"06","title":"Ferramentas de apoio à gestão","short":"Trello, Jira, Asana, MS Project e outras soluções para organizar o trabalho.","intro":"Ferramentas não substituem a boa gestão, mas aumentam a visibilidade, a colaboração e a rastreabilidade. A escolha depende do tamanho da equipe, da abordagem adotada, da integração com outros sistemas e do orçamento.","sections":[{"heading":"Principais ferramentas","table":{"headers":["Ferramenta","Ponto forte","Ideal para"],"rows":[["Trello","Quadros Kanban simples e visuais","Equipes pequenas, tarefas simples"],["Jira","Scrum/Kanban robusto, workflows e relatórios","Times de desenvolvimento de software"],["Asana","Gestão de tarefas e portfólios multiárea","Equipes mistas de negócio e TI"],["MS Project","Cronogramas, caminho crítico e recursos","Projetos preditivos e grandes programas"],["Azure DevOps","Backlog, repositórios, pipelines e testes","Ecossistema Microsoft e DevOps"],["ClickUp / Monday","Flexibilidade e automações","Organizações que buscam uma plataforma única"],["Notion / Confluence","Documentação e base de conhecimento","Registro de decisões e wikis"]]}},{"heading":"Ferramentas complementares","cards":[{"title":"Comunicação","text":"Slack, Microsoft Teams e Google Chat para conversas rápidas e integrações."},{"title":"Colaboração visual","text":"Miro e FigJam para workshops, mapas de histórias e retrospectivas."},{"title":"Código e DevOps","text":"GitHub, GitLab e Bitbucket com integração contínua e entrega contínua."},{"title":"Indicadores","text":"Power BI, Looker e dashboards nativos para acompanhar métricas."}]},{"heading":"Sites oficiais das ferramentas","text":"Acesse o site oficial de cada ferramenta para conhecer planos, recursos e versões de teste.","links":[{"label":"Trello","url":"https://trello.com"},{"label":"Jira","url":"https://www.atlassian.com/software/jira"},{"label":"Asana","url":"https://asana.com"},{"label":"MS Project","url":"https://www.microsoft.com/microsoft-365/project/project-management-software"},{"label":"Azure DevOps","url":"https://azure.microsoft.com/products/devops"},{"label":"ClickUp","url":"https://clickup.com"},{"label":"Monday","url":"https://monday.com"},{"label":"Notion","url":"https://www.notion.so"},{"label":"Confluence","url":"https://www.atlassian.com/software/confluence"},{"label":"Slack","url":"https://slack.com"},{"label":"Microsoft Teams","url":"https://www.microsoft.com/microsoft-teams"},{"label":"Google Chat","url":"https://workspace.google.com/products/chat/"},{"label":"Miro","url":"https://miro.com"},{"label":"FigJam","url":"https://www.figma.com/figjam/"},{"label":"GitHub","url":"https://github.com"},{"label":"GitLab","url":"https://about.gitlab.com"},{"label":"Bitbucket","url":"https://bitbucket.org"},{"label":"Power BI","url":"https://www.microsoft.com/power-platform/products/power-bi"},{"label":"Looker","url":"https://cloud.google.com/looker"}]},{"heading":"Como escolher","bullets":["Comece pelo processo: a ferramenta deve apoiar a forma de trabalho, não ditá-la.","Avalie integrações com repositórios de código, chat e sistemas corporativos.","Considere curva de aprendizado, custo por usuário e requisitos de segurança.","Faça um piloto com uma equipe antes de expandir para toda a organização."]}],"takeaways":["A ferramenta certa é a que a equipe realmente usa.","Jira e Azure DevOps dominam o desenvolvimento; MS Project, os cronogramas preditivos.","Integração entre ferramentas evita retrabalho e informação desatualizada."]},{"slug":"papeis-scrum","number":"07","title":"Product Owner, Scrum Master e equipe","short":"Responsabilidades e interações dos papéis que fazem o Scrum funcionar.","intro":"No Scrum, não existe o papel de 'gerente de projeto' tradicional. As responsabilidades de gestão são distribuídas entre três papéis complementares que formam o Scrum Team, uma unidade pequena (normalmente até 10 pessoas), multifuncional e autogerenciada.","sections":[{"heading":"Os três papéis","cards":[{"title":"Product Owner (PO)","text":"Responsável por maximizar o valor do produto. Define a meta do produto, cria e ordena o Product Backlog, escreve itens claros e é a voz do cliente e do negócio. É uma pessoa, não um comitê."},{"title":"Scrum Master (SM)","text":"Líder-servidor que garante a eficácia do time. Facilita eventos, remove impedimentos, ensina Scrum para a equipe e para a organização e promove melhoria contínua."},{"title":"Desenvolvedores","text":"Profissionais que criam o incremento a cada sprint: programadores, testadores, designers, analistas, especialistas em infraestrutura. Planejam o Sprint Backlog e são responsáveis pela qualidade."}]},{"heading":"Eventos do Scrum","table":{"headers":["Evento","Objetivo","Duração máx. (sprint de 1 mês)"],"rows":[["Sprint","Contêiner de todo o trabalho","1 mês"],["Sprint Planning","Definir meta e itens da sprint","8 horas"],["Daily Scrum","Inspecionar progresso rumo à meta","15 minutos"],["Sprint Review","Apresentar o incremento e adaptar o backlog","4 horas"],["Retrospectiva","Melhorar processos, pessoas e ferramentas","3 horas"]]}},{"heading":"Erros comuns","bullets":["PO sem autoridade para decidir prioridades.","Scrum Master atuando como 'chefe' ou secretário da equipe.","Daily transformada em reunião de status para o gestor.","Equipe sem todas as competências necessárias para entregar o incremento.","Pular a retrospectiva por 'falta de tempo'."]}],"takeaways":["PO cuida do 'o quê' e do 'porquê'; Desenvolvedores, do 'como'.","Scrum Master é facilitador e coach, não gerente.","Autogestão e multidisciplinaridade são a base do Scrum Team."]},{"slug":"setores-publico-privado-terceiro","number":"08","title":"Projetos de TI nos setores público, privado e terceiro setor","short":"Como o contexto organizacional muda a forma de gerenciar projetos.","intro":"Os princípios de gestão de projetos são os mesmos, mas cada setor tem objetivos, restrições, fontes de recursos e formas de prestar contas diferentes. Entender essas diferenças é fundamental para adaptar métodos e expectativas.","sections":[{"heading":"Comparativo entre setores","table":{"headers":["Aspecto","Público","Privado","Terceiro setor"],"rows":[["Objetivo","Interesse público, serviço ao cidadão","Lucro e vantagem competitiva","Impacto social e missão"],["Recursos","Orçamento público (LOA)","Investimento próprio ou de mercado","Doações, editais, parcerias"],["Contratação","Licitação (Lei 14.133/2021)","Livre negociação","Regras de financiadores"],["Prestação de contas","Tribunais de contas, transparência","Acionistas e conselho","Doadores e sociedade"],["Velocidade","Mais lenta, muitos controles","Alta, pressão de mercado","Variável, depende de recursos"]]}},{"heading":"Setor público","bullets":["Contratações seguem a Nova Lei de Licitações e normas como a IN SGD/ME nº 94/2022.","Iniciativas de governo digital (gov.br) ampliaram o uso de métodos ágeis.","Exigência de conformidade com LGPD, acessibilidade e transparência.","Mudanças de gestão política podem alterar prioridades."]},{"heading":"Setor privado","bullets":["Foco em time-to-market, retorno sobre investimento (ROI) e experiência do cliente.","Maior liberdade para experimentar, pivotar e encerrar projetos sem retorno.","Uso intenso de produto digital, dados e automação para competir."]},{"heading":"Terceiro setor","bullets":["Equipes enxutas, muitas vezes com voluntários.","Projetos ligados a editais com prazos e relatórios rígidos.","Soluções de baixo custo, software livre e programas de doação de tecnologia.","Métricas de impacto social são tão importantes quanto as financeiras."]}],"takeaways":["O contexto define restrições: leis, orçamento, prestação de contas.","O setor público avança na agilidade, mas dentro de regras de contratação.","No terceiro setor, impacto social é o principal indicador de sucesso."]},{"slug":"indicadores-e-metricas","number":"09","title":"Indicadores e métricas","short":"Como medir progresso, desempenho, qualidade e valor dos projetos.","intro":"O que não é medido dificilmente é gerenciado. Indicadores (KPIs) permitem acompanhar a saúde do projeto, antecipar problemas e tomar decisões baseadas em dados. O segredo é medir poucas coisas, mas as certas — evitando métricas de vaidade.","sections":[{"heading":"Métricas tradicionais (Valor Agregado — EVM)","table":{"headers":["Indicador","Fórmula","Interpretação"],"rows":[["CPI (Índice de Desempenho de Custo)","VA / CR","\u003c 1 indica custo acima do previsto"],["SPI (Índice de Desempenho de Prazo)","VA / VP","\u003c 1 indica atraso"],["CV (Variação de Custo)","VA − CR","Negativo = estouro de orçamento"],["SV (Variação de Prazo)","VA − VP","Negativo = atraso"],["EAC (Estimativa no Término)","ONT / CPI","Previsão do custo final"]]},"text":"VA = Valor Agregado; VP = Valor Planejado; CR = Custo Real; ONT = Orçamento no Término."},{"heading":"Métricas ágeis","cards":[{"title":"Velocidade","text":"Pontos ou itens entregues por sprint; serve para previsão, não para comparar equipes."},{"title":"Burndown / Burnup","text":"Gráficos que mostram trabalho restante ou concluído ao longo do tempo."},{"title":"Lead time e cycle time","text":"Tempo desde o pedido até a entrega e desde o início do trabalho até a conclusão."},{"title":"Throughput","text":"Quantidade de itens concluídos por período."},{"title":"WIP","text":"Trabalho em progresso; WIP alto costuma indicar gargalos."},{"title":"Diagrama de fluxo cumulativo","text":"Visualiza o fluxo de itens em cada etapa e revela gargalos."}]},{"heading":"Métricas DORA (DevOps)","bullets":["Frequência de implantação: com que frequência há deploys em produção.","Lead time para mudanças: tempo do commit até a produção.","Taxa de falha de mudanças: percentual de deploys que causam incidentes.","Tempo de recuperação (MTTR): quanto tempo leva para restaurar o serviço."]},{"heading":"Métricas de valor e qualidade","bullets":["ROI, payback e redução de custos operacionais.","Satisfação do cliente (NPS, CSAT) e adoção pelos usuários.","Defeitos encontrados em produção e cobertura de testes.","OKRs para alinhar resultados do projeto à estratégia."]}],"takeaways":["CPI e SPI resumem a saúde de custo e prazo em projetos preditivos.","Lead time, throughput e métricas DORA são essenciais em ambientes ágeis e DevOps.","Meça resultado e valor, não apenas atividade."]},{"slug":"soft-skills","number":"10","title":"Soft skills para liderar equipes digitais","short":"Competências humanas que fazem a diferença em times remotos e híbridos.","intro":"Projetos falham mais por problemas de pessoas do que por problemas técnicos. Em ambientes digitais, remotos ou híbridos, competências comportamentais se tornam ainda mais importantes para manter engajamento, confiança e alinhamento.","sections":[{"heading":"Competências essenciais","cards":[{"title":"Comunicação clara","text":"Saber traduzir temas técnicos para o negócio e escrever de forma objetiva em canais assíncronos."},{"title":"Inteligência emocional","text":"Reconhecer e gerenciar emoções próprias e da equipe, sobretudo sob pressão."},{"title":"Empatia","text":"Compreender perspectivas de usuários, colegas e stakeholders diferentes."},{"title":"Negociação e gestão de conflitos","text":"Conduzir divergências para soluções ganha-ganha sem desgastar relações."},{"title":"Liderança servidora","text":"Colocar-se a serviço da equipe, removendo obstáculos e desenvolvendo pessoas."},{"title":"Adaptabilidade","text":"Lidar com mudanças tecnológicas e de prioridade com resiliência."},{"title":"Pensamento crítico","text":"Analisar problemas com dados, questionar premissas e tomar decisões fundamentadas."},{"title":"Feedback","text":"Dar e receber feedback contínuo, específico e respeitoso."}]},{"heading":"Liderando equipes remotas e híbridas","bullets":["Estabeleça acordos de trabalho: horários de sobreposição, canais e tempos de resposta.","Priorize a comunicação assíncrona e documente decisões.","Promova segurança psicológica: errar e perguntar deve ser seguro.","Use rituais de conexão (check-ins, celebrações) para fortalecer o vínculo.","Avalie resultados entregues, não horas online.","Cuide do bem-estar e esteja atento a sinais de esgotamento (burnout)."]}],"takeaways":["Segurança psicológica é o principal fator de equipes de alto desempenho.","Em times remotos, documentar é comunicar.","Liderar é servir: remover impedimentos e desenvolver pessoas."]},{"slug":"casos-reais","number":"11","title":"Casos reais de sucesso e insucesso","short":"O que grandes projetos de TI ensinam sobre acertos e erros.","intro":"Estudar casos reais ajuda a entender, na prática, como decisões de gestão impactam resultados. Os exemplos abaixo são amplamente documentados e usados em cursos e publicações da área.","sections":[{"heading":"Casos de sucesso","cards":[{"title":"Spotify — modelo de squads","text":"Organizou-se em squads autônomos, tribos, chapters e guilds para escalar a agilidade. Mesmo a própria empresa afirma que o modelo evoluiu, mas ele inspirou autonomia e alinhamento em muitas organizações."},{"title":"PIX — Banco Central do Brasil","text":"Lançado em 2020, o sistema de pagamentos instantâneos foi desenvolvido com forte governança, colaboração com o mercado e entregas planejadas. Tornou-se um dos meios de pagamento mais usados do país."},{"title":"gov.br — Governo Digital","text":"Unificação de serviços públicos em uma plataforma digital, com uso de métodos ágeis e foco na experiência do cidadão, digitalizando milhares de serviços."},{"title":"Amazon — implantação contínua","text":"A adoção de microsserviços e DevOps permitiu milhares de implantações por dia, reduzindo riscos e acelerando a inovação."}],"links":[{"label":"Spotify — blog de engenharia","url":"https://engineering.atspotify.com/"},{"label":"PIX — Banco Central do Brasil","url":"https://www.bcb.gov.br/estabilidadefinanceira/pix"},{"label":"gov.br — Governo Federal","url":"https://www.gov.br/"},{"label":"Amazon Web Services","url":"https://aws.amazon.com/devops/"}]},{"heading":"Casos de insucesso","cards":[{"title":"HealthCare.gov (EUA, 2013)","text":"O portal do programa de saúde americano falhou no lançamento: falta de testes integrados, muitos fornecedores sem coordenação e prazo político inflexível. Foi recuperado com equipe enxuta e práticas ágeis."},{"title":"NHS National Programme for IT (Reino Unido)","text":"Programa para digitalizar registros de saúde, encerrado após bilhões de libras gastos. Escopo gigantesco, pouca participação dos usuários e abordagem centralizada."},{"title":"Denver Airport — bagagens (EUA, anos 1990)","text":"Sistema automatizado de bagagens com escopo ambicioso e mudanças tardias causou atrasos de mais de um ano e custos enormes. Clássico exemplo de subestimação da complexidade."},{"title":"Knight Capital (2012)","text":"Uma implantação manual mal controlada ativou código antigo e gerou perdas de cerca de 440 milhões de dólares em 45 minutos. Mostra a importância de automação e controle de mudanças."}],"links":[{"label":"HealthCare.gov","url":"https://www.healthcare.gov/"},{"label":"NHS England","url":"https://www.england.nhs.uk/"},{"label":"Denver International Airport","url":"https://www.flydenver.com/"},{"label":"SEC — relatório do caso Knight Capital","url":"https://www.sec.gov/enforcement-litigation/administrative-proceedings/34-67288"}]},{"heading":"Lições aprendidas","bullets":["Envolva usuários reais desde o início e valide com frequência.","Prefira entregas incrementais a grandes lançamentos de uma vez.","Testes integrados e automação de implantação não são opcionais.","Prazos políticos ou comerciais não podem ignorar a realidade técnica.","Governança clara é essencial quando há múltiplos fornecedores."]}],"takeaways":["Os fracassos raramente são técnicos: são de gestão, escopo e comunicação.","Entregas incrementais e usuários envolvidos aparecem em quase todo caso de sucesso.","Automação e controle de mudanças evitam desastres operacionais."]},{"slug":"tendencias-futuras","number":"12","title":"Tendências futuras","short":"IA generativa, automação, DevOps e o novo papel do gestor de projetos.","intro":"A gestão de projetos está passando por uma transformação acelerada. Inteligência artificial, automação e práticas de DevOps estão mudando como planejamos, executamos e acompanhamos projetos — e exigem novas competências dos profissionais.","sections":[{"heading":"IA generativa na gestão de projetos","cards":[{"title":"Planejamento assistido","text":"Geração de EAPs, histórias de usuário, critérios de aceite e cronogramas iniciais a partir de descrições."},{"title":"Análise preditiva","text":"Modelos que identificam riscos de atraso e estouro de custo com base em dados históricos."},{"title":"Relatórios automáticos","text":"Resumos de status, atas de reunião e comunicados gerados a partir das ferramentas do projeto."},{"title":"Copilotos de código","text":"Assistentes de programação que aumentam a produtividade dos desenvolvedores e mudam estimativas."}]},{"heading":"Automação e DevOps","bullets":["Integração e entrega contínuas (CI/CD) tornam as implantações rotineiras e seguras.","Infraestrutura como código (Terraform, Pulumi) e GitOps.","DevSecOps: segurança integrada desde o início do ciclo.","Platform Engineering: plataformas internas que aceleram as equipes de produto.","Observabilidade e SRE para medir confiabilidade com SLOs."]},{"heading":"Outras tendências","bullets":["Gestão orientada a produto (product mindset) em vez de projetos isolados.","Value Stream Management: visão de ponta a ponta do fluxo de valor.","Low-code e no-code ampliando quem pode criar soluções.","Sustentabilidade digital (Green IT) e critérios ESG nos projetos.","Ética e governança de IA, com atenção à LGPD e a vieses algorítmicos."]},{"heading":"O novo perfil do gestor","text":"O gestor do futuro será menos um controlador de tarefas e mais um orquestrador de valor: alguém que entende de negócio, dados e tecnologia, usa a IA como aliada para tarefas repetitivas e dedica mais tempo às pessoas, à estratégia e à tomada de decisão."}],"takeaways":["A IA vai automatizar tarefas administrativas, não a liderança.","DevOps e automação são pré-requisitos para entregar com frequência e segurança.","Competências humanas e visão de negócio serão o diferencial do gestor."]}]</script>
<script>
(() => {
"use strict";
/* ===== util.js: ajudantes, dados dos tópicos e perguntas sugeridas ===== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
// mesma regra do site original: id estável para o título de cada seção
const sectionId = (h) => norm(h).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const store = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento: segue sem histórico */ } },
};

/* Os 12 tópicos vêm do topics.ts do projeto (textos sem alteração).
   A cor de cada tópico segue o mesmo rodízio dos cards da página inicial. */
const TONES = ["blue", "navy", "cyan", "white"];
const TOPICS = JSON.parse($("#topics-data").textContent).map((t, i) => ({ ...t, i, tone: TONES[i % TONES.length] }));
const BY_SLUG = new Map(TOPICS.map((t) => [t.slug, t]));
/* Endereços das páginas: só letras, números e hífens depois do #.
   #inicio  #topicos  #sobre  #assistente  #t-<slug>  #t-<slug>--<secao> */
const topicHref = (slug, section) => "#t-" + slug + (section ? "--" + section : "");

/* Perguntas sugeridas em cada tópico (aparecem na página do tópico e no assistente). */
